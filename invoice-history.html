<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>請求書一覧 | IG Rod Planning</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink: #111; --sub: #555; --line: #ccc; --line2: #e2e2e2; --red: #cc2200; --bg: #f2f2f0; --paper: #fff; }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; padding: 1.6rem 1.2rem 4rem; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .back-link { display: inline-block; margin-bottom: 0.6rem; font-size: 0.82rem; font-weight: 700; color: var(--sub); text-decoration: none; }
  .back-link:hover { color: var(--red); }
  header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid var(--ink); padding-bottom: 0.8rem; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.6rem; }
  header h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: 0.05em; }
  header .new-btn { font-size: 0.85rem; font-weight: 700; color: #fff; background: var(--ink); text-decoration: none; padding: 0.55rem 1.1rem; }
  header .new-btn:hover { background: var(--red); }
  .filters { display: grid; grid-template-columns: 1fr 11rem; gap: 0.6rem; margin-bottom: 0.8rem; }
  .filters.with-status { grid-template-columns: 1fr 9rem 11rem; }
  .badge { display: inline-block; font-size: 0.66rem; font-weight: 700; padding: 0.05rem 0.45rem; margin-left: 0.5rem; border: 1px solid currentColor; vertical-align: 0.1em; }
  .badge.unbilled { color: var(--red); }
  .badge.billed { color: var(--sub); }
  header .head-links { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  header .closing-btn { font-size: 0.85rem; font-weight: 700; color: var(--ink); background: #fff; border: 1px solid var(--ink); text-decoration: none; padding: 0.5rem 1rem; }
  header .closing-btn:hover { background: #eee; }
  .filters input, .filters select { width: 100%; border: 2px solid var(--ink); background: var(--paper); font-family: inherit; font-size: 1rem; padding: 0.7rem 0.9rem; }
  .filters input:focus, .filters select:focus { outline: none; border-color: var(--red); }
  .stats { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 0.4rem; font-size: 0.78rem; color: var(--sub); margin-bottom: 1rem; }
  .stats b { color: var(--ink); font-size: 0.95rem; }
  .card { background: var(--paper); border: 1px solid var(--line); margin-bottom: 0.7rem; }
  .summary { display: grid; grid-template-columns: auto 6.5rem 1fr auto 1rem; align-items: center; gap: 0.9rem; padding: 0.85rem 1.1rem; cursor: pointer; }
  .summary:hover { background: #fafafa; }
  .summary .when { font-size: 0.78rem; color: var(--sub); line-height: 1.35; }
  .summary .when small { display: block; font-size: 0.68rem; }
  .summary .who { font-weight: 700; font-size: 0.95rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .summary .who small { font-weight: 400; color: var(--sub); font-size: 0.72rem; margin-left: 0.5rem; }
  .summary .total { font-weight: 900; font-size: 1rem; white-space: nowrap; text-align: right; }
  .summary .arrow { font-size: 0.7rem; color: var(--sub); transition: transform 0.15s; }
  .card.open .arrow { transform: rotate(90deg); }
  .detail { display: none; border-top: 1px solid var(--line2); padding: 1rem 1.1rem 1.2rem; }
  .card.open .detail { display: block; }
  .actions { display: flex; gap: 0.6rem; margin-bottom: 1rem; flex-wrap: wrap; }
  .actions button { font-family: inherit; font-size: 0.84rem; font-weight: 700; padding: 0.65rem 1rem; cursor: pointer; border: 1px solid var(--ink); }
  .edit-btn { flex: 1 1 12rem; color: #fff; background: var(--ink); }
  .edit-btn:hover { background: var(--red); border-color: var(--red); }
  .copy-btn { flex: 1 1 10rem; color: var(--ink); background: #fff; }
  .copy-btn:hover { background: #eee; }
  .delete-btn { color: var(--sub); background: #fff; border-color: var(--line) !important; }
  .delete-btn:hover { color: #fff; background: var(--red); border-color: var(--red) !important; }
  .meta { font-size: 0.8rem; color: var(--sub); margin-bottom: 0.6rem; }
  table.lines { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
  table.lines th { text-align: left; font-size: 0.68rem; color: var(--sub); border-bottom: 1px solid var(--line); padding: 0.3rem 0.3rem; }
  table.lines td { border-bottom: 1px dotted var(--line2); padding: 0.35rem 0.3rem; vertical-align: top; }
  table.lines .n { text-align: right; white-space: nowrap; }
  .sum { margin-top: 0.6rem; margin-left: auto; max-width: 18rem; font-size: 0.84rem; }
  .sum div { display: flex; justify-content: space-between; padding: 0.15rem 0.3rem; }
  .sum .g { border-top: 2px solid var(--ink); margin-top: 0.2rem; padding-top: 0.35rem; font-weight: 900; }
  .notes { margin-top: 0.7rem; font-size: 0.8rem; white-space: pre-wrap; color: var(--sub); }
  .pick { width: 17px; height: 17px; cursor: pointer; }
  .select-bar { display: none; background: var(--paper); border: 1px solid var(--line); padding: 0.7rem 1rem; margin-bottom: 1rem; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  .select-bar.active { display: flex; }
  .select-bar span { font-size: 0.8rem; color: var(--sub); }
  .select-bar .btns { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .select-bar button { font-family: inherit; font-size: 0.82rem; font-weight: 700; color: #fff; background: var(--ink); border: 1px solid var(--ink); padding: 0.55rem 1rem; cursor: pointer; white-space: nowrap; }
  .select-bar button:hover { background: var(--red); border-color: var(--red); }
  .select-bar button:disabled { opacity: 0.6; cursor: default; }
  .empty { text-align: center; color: var(--sub); padding: 3rem 1rem; font-size: 0.85rem; }
  @media screen and (max-width: 560px) {
    .filters.with-status { grid-template-columns: 1fr; }
    .filters { grid-template-columns: 1fr; }
    .summary { grid-template-columns: auto 1fr auto; row-gap: 0.1rem; }
    .summary .when { grid-column: 2 / -1; }
    .summary .who { grid-column: 2; }
    .summary .arrow { display: none; }
    table.lines .hide-sm { display: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back-link" href="documents.html">← 書類トップ</a>
    <header>
      <h1 id="page-title">請求書一覧</h1>
      <div class="head-links">
        <a class="closing-btn" href="closing.html">締め請求 →</a>
        <a class="new-btn" id="new-btn" href="invoice.html">＋ 新しい請求書</a>
      </div>
    </header>
    <div class="filters" id="filters">
      <input type="text" id="f-search" placeholder="お客様名・品名・番号で検索">
      <select id="f-status" hidden><option value="">すべて</option><option value="unbilled">未請求</option><option value="billed">請求済み</option></select>
      <select id="f-month"><option value="">すべての月</option></select>
    </div>
    <div class="stats"><span id="status-line">読み込み中…</span><span id="sum-line"></span></div>
    <div class="select-bar" id="select-bar">
      <span id="select-count">0件選択中</span>
      <div class="btns">
        <button type="button" id="btn-pdf">選択したものをまとめてPDF保存</button>
        <button type="button" id="btn-clear">選択解除</button>
      </div>
    </div>
    <div id="list"></div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="pdf-download.js"></script>
<script src="bulk-pdf.js"></script>
<script>
  var SYNC_API = 'https://ig-sync.pokugou.workers.dev';
  var invoices = [];
  var KIND = new URLSearchParams(location.search).get('type') === 'delivery' ? 'delivery' : 'invoice';
  var DOC = KIND === 'delivery'
    ? { tag: '__delivery', title: '納品書', editor: 'invoice.html?type=delivery', reloadKey: 'delivery-reload', amountLabel: '合計金額' }
    : { tag: '__invoice', title: '請求書', editor: 'invoice.html', reloadKey: 'invoice-reload', amountLabel: 'ご請求金額' };
  document.title = DOC.title + '一覧 | IG Rod Planning';
  document.getElementById('page-title').textContent = DOC.title + '一覧';
  document.getElementById('new-btn').href = DOC.editor;
  document.getElementById('new-btn').textContent = '＋ 新しい' + DOC.title;
  var term = '', month = '', status = '';
  var selected = {};

  // 全角の数字・記号（日本語入力オンのまま入力した場合）も半角にして読む
  function toHalf(s) { return String(s == null ? '' : s).replace(/[０-９．，－]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/[ー−‐]/g, '-'); }
  function num(s) { var v = parseFloat(toHalf(s).replace(/[^0-9.-]/g, '')); return isNaN(v) ? 0 : v; }
  function yen(n) { return (n < 0 ? '-¥' : '¥') + Math.abs(Math.round(n)).toLocaleString('ja-JP'); }
  function fmtDate(iso) { if (!iso) return ''; var p = iso.split('-'); return p[0] + '/' + Number(p[1]) + '/' + Number(p[2]); }
  function todayIso() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  function figures(inv) {
    var sub = 0;
    (inv.items || []).forEach(function (it) { sub += num(it.amt); });
    var tax = Math.round(Math.round(sub * 0.1 * 1e6) / 1e6);
    var carry = inv.showCarry === false ? 0 : num(inv.prev) - num(inv.paid);
    return { sub: sub, tax: tax, carry: carry, total: carry + sub + tax };
  }

  function matches(inv) {
    if (month && String(inv.date || '').slice(0, 7) !== month) return false;
    if (status === 'unbilled' && inv.billedBy) return false;
    if (status === 'billed' && !inv.billedBy) return false;
    if (!term) return true;
    var hay = [inv.customer, inv.number, inv.address, inv.address2, inv.notes].concat((inv.items || []).map(function (i) { return i.name + ' ' + (i.note || ''); })).join(' ').toLowerCase();
    return hay.indexOf(term) !== -1;
  }

  // 削除は「今の最新データ」を読み直して、その1件だけを取り除く。
  // （画面を開いた時点の一覧で上書きすると、その後に別のタブで保存した書類が消えてしまうため）
  async function deleteRecord(id) {
    var res = await fetch(SYNC_API + '/paint?_=' + Date.now());
    if (!res.ok) throw new Error('load failed');
    var all = (await res.json()).filter(function (r) { return !(r[DOC.tag] && r.id === id); });
    if (KIND === 'invoice') {
      // 削除した請求書に含まれていた納品書は「未請求」に戻す
      all.forEach(function (r) { if (r.__delivery && r.billedBy === id) { delete r.billedBy; delete r.billedNumber; } });
    }
    var put = await fetch(SYNC_API + '/paint', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(all) });
    if (!put.ok) throw new Error('save failed');
    invoices = all.filter(function (r) { return r[DOC.tag]; });
    invoices.sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')) || String(b.number || '').localeCompare(String(a.number || '')); });
  }

  /* ---------- PDF保存（1件／チェックしたものをまとめて） ---------- */
  function updateSelectBar() {
    var n = Object.keys(selected).length;
    document.getElementById('select-bar').classList.toggle('active', n > 0);
    document.getElementById('select-count').textContent = n + '件選択中';
  }
  function pdfName(items) {
    if (items.length === 1) {
      var r = items[0], who = String(r.customer || '').trim().replace(/[\\/:*?"<>|]/g, '');
      return String(r.date || '').replace(/-/g, '') + (KIND === 'delivery' ? '納品書' : '') + (who ? who + '様' : DOC.title) + '.pdf';
    }
    return DOC.title + '_' + items.length + '件_' + bulkStamp() + '.pdf';
  }
  function makePdf(items, btn) {
    BulkPdf.run({
      btn: btn, items: items, storageKey: DOC.reloadKey,
      margin: 0, // 請求書は窓付き封筒に合わせて用紙いっぱいに配置しているので余白を足さない
      renderOne: function (r) {
        return BulkPdf.viaFrame(DOC.editor + (DOC.editor.indexOf('?') > -1 ? '&' : '?') + 'embed=1', DOC.reloadKey, JSON.stringify(r), function (w) { return w.captureForBulk(); });
      },
      name: pdfName
    });
  }
  document.getElementById('btn-pdf').addEventListener('click', function () {
    makePdf(invoices.filter(function (r) { return selected[r.id]; }), this);
  });
  document.getElementById('btn-clear').addEventListener('click', function () { selected = {}; updateSelectBar(); render(); });

  function openInEditor(inv) {
    localStorage.setItem(DOC.reloadKey, JSON.stringify(inv));
    location.href = DOC.editor;
  }

  function buildMonths() {
    var sel = document.getElementById('f-month');
    var seen = {};
    invoices.forEach(function (inv) { var m = String(inv.date || '').slice(0, 7); if (m) seen[m] = true; });
    sel.innerHTML = '<option value="">すべての月</option>';
    Object.keys(seen).sort().reverse().forEach(function (m) {
      var o = document.createElement('option');
      o.value = m; o.textContent = m.slice(0, 4) + '年' + Number(m.slice(5)) + '月';
      sel.appendChild(o);
    });
    sel.value = seen[month] ? month : '';
    month = sel.value;
  }

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function render() {
    var list = document.getElementById('list');
    var visible = invoices.filter(matches);
    document.getElementById('status-line').textContent = (term || month) ? visible.length + '件 / 全' + invoices.length + '件' : invoices.length + '件';
    var sum = 0;
    visible.forEach(function (inv) { sum += figures(inv).total; });
    document.getElementById('sum-line').innerHTML = visible.length ? '表示中の合計 <b>' + yen(sum) + '</b>' : '';
    list.innerHTML = '';
    if (!visible.length) { list.innerHTML = '<p class="empty">' + (term || month ? '一致する' + DOC.title + 'がありません' : 'まだ保存された' + DOC.title + 'がありません') + '</p>'; return; }

    visible.forEach(function (inv) {
      var f = figures(inv);
      var card = el('div', 'card');
      var s = el('div', 'summary');
      var pick = document.createElement('input'); pick.type = 'checkbox'; pick.className = 'pick'; pick.checked = !!selected[inv.id];
      pick.addEventListener('click', function (e) { e.stopPropagation(); });
      pick.addEventListener('change', function () { if (pick.checked) selected[inv.id] = true; else delete selected[inv.id]; updateSelectBar(); });
      s.appendChild(pick);
      var when = el('span', 'when', fmtDate(inv.date)); when.appendChild(el('small', null, inv.number || ''));
      var who = el('span', 'who', inv.customer ? inv.customer + ' ' + (inv.honor || '様') : '(名前未記入)');
      if (KIND === 'delivery') who.appendChild(el('span', 'badge ' + (inv.billedBy ? 'billed' : 'unbilled'), inv.billedBy ? '請求済み' + (inv.billedNumber ? ' ' + inv.billedNumber : '') : '未請求'));
      if (KIND === 'invoice' && inv.fromDeliveries && inv.fromDeliveries.length) who.appendChild(el('small', null, '納品書' + inv.fromDeliveries.length + '件'));
      s.appendChild(when); s.appendChild(who); s.appendChild(el('span', 'total', yen(f.total))); s.appendChild(el('span', 'arrow', '▶'));
      s.addEventListener('click', function () { card.classList.toggle('open'); });

      var d = el('div', 'detail');
      var acts = el('div', 'actions');
      var edit = el('button', 'edit-btn', '開いて編集・PDF再出力 →'); edit.type = 'button';
      edit.addEventListener('click', function () { openInEditor(inv); });
      var copy = el('button', 'copy-btn', '複製して新規作成'); copy.type = 'button';
      copy.addEventListener('click', function () {
        var c = JSON.parse(JSON.stringify(inv));
        delete c.id; delete c.billedBy; delete c.billedNumber; delete c.fromDeliveries;
        c.number = ''; c.date = todayIso(); c.due = '';
        openInEditor(c);
      });
      var del = el('button', 'delete-btn', '削除'); del.type = 'button';
      del.addEventListener('click', async function () {
        var extra = KIND === 'invoice' && inv.fromDeliveries && inv.fromDeliveries.length ? '\n（含まれていた納品書' + inv.fromDeliveries.length + '件は「未請求」に戻ります）'
          : KIND === 'delivery' && inv.billedBy ? '\n（この納品書は請求書 ' + (inv.billedNumber || '') + ' に含まれています）' : '';
        if (!confirm((inv.customer || 'この' + DOC.title) + '（' + (inv.number || fmtDate(inv.date)) + '）を本当に削除しますか？' + extra)) return;
        try { await deleteRecord(inv.id); } catch (e) { alert('削除の反映に失敗しました。通信状況を確認してもう一度お試しください。'); }
        buildMonths(); render();
      });
      acts.appendChild(edit); acts.appendChild(copy);
      if (KIND === 'delivery') {
        var toInv = el('button', 'copy-btn', 'この納品書から請求書を作る'); toInv.type = 'button';
        toInv.addEventListener('click', function () {
          var c = JSON.parse(JSON.stringify(inv));
          if (inv.billedBy && !confirm('この納品書はすでに請求書 ' + (inv.billedNumber || '') + ' で請求済みです。それでも請求書を作りますか？')) return;
          delete c.id; delete c.__delivery; delete c.billedBy; delete c.billedNumber;
          c.fromDeliveries = [inv.id]; c.showCarry = true; c.number = ''; c.date = todayIso(); c.due = '';
          localStorage.setItem('invoice-reload', JSON.stringify(c));
          location.href = 'invoice.html';
        });
        acts.appendChild(toInv);
      }
      var pdfBtn = el('button', 'copy-btn', 'PDF保存'); pdfBtn.type = 'button';
      pdfBtn.addEventListener('click', function () { makePdf([inv], pdfBtn); });
      acts.appendChild(pdfBtn);
      acts.appendChild(del);
      d.appendChild(acts);

      var meta = [];
      if (inv.address) meta.push((inv.zip ? '〒' + inv.zip + ' ' : '') + inv.address + (inv.address2 ? ' ' + inv.address2 : ''));
      if (meta.length) d.appendChild(el('div', 'meta', meta.join('　／　')));

      var t = el('table', 'lines');
      t.innerHTML = '<thead><tr><th class="hide-sm">日付</th><th>品名</th><th class="n">数量</th><th class="n hide-sm">単価</th><th class="n">金額</th></tr></thead>';
      var tb = el('tbody');
      (inv.items || []).forEach(function (it) {
        var tr = el('tr');
        tr.appendChild(el('td', 'hide-sm', it.date || ''));
        tr.appendChild(el('td', null, (it.name || '') + (it.note ? '（' + it.note + '）' : '')));
        tr.appendChild(el('td', 'n', it.qty || ''));
        tr.appendChild(el('td', 'n hide-sm', String(it.unit || '').trim() ? yen(num(it.unit)) : ''));
        tr.appendChild(el('td', 'n', String(it.amt || '').trim() ? yen(num(it.amt)) : ''));
        tb.appendChild(tr);
      });
      t.appendChild(tb); d.appendChild(t);

      var sm = el('div', 'sum');
      [['小計', f.sub], ['消費税', f.tax]].concat(f.carry ? [['繰越金額', f.carry]] : []).forEach(function (p) {
        var r = el('div'); r.appendChild(el('span', null, p[0])); r.appendChild(el('span', null, yen(p[1]))); sm.appendChild(r);
      });
      var g = el('div', 'g'); g.appendChild(el('span', null, DOC.amountLabel)); g.appendChild(el('span', null, yen(f.total))); sm.appendChild(g);
      d.appendChild(sm);
      if (inv.notes) d.appendChild(el('div', 'notes', inv.notes));

      card.appendChild(s); card.appendChild(d); list.appendChild(card);
    });
  }

  document.getElementById('f-search').addEventListener('input', function (e) { term = e.target.value.trim().toLowerCase(); render(); });
  if (KIND === 'delivery') {
    document.getElementById('f-status').hidden = false;
    document.getElementById('filters').classList.add('with-status');
  }
  document.getElementById('f-status').addEventListener('change', function (e) { status = e.target.value; render(); });
  document.getElementById('f-month').addEventListener('change', function (e) { month = e.target.value; render(); });

  fetch(SYNC_API + '/paint?_=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error('not ready'); return r.json(); })
    .then(function (data) {
      invoices = data.filter(function (r) { return r[DOC.tag]; });
      invoices.sort(function (a, b) { return String(b.date || '').localeCompare(String(a.date || '')) || String(b.number || '').localeCompare(String(a.number || '')); });
      buildMonths(); render();
    })
    .catch(function () { document.getElementById('status-line').textContent = '読み込めませんでした。通信状況を確認して再読み込みしてください'; });
</script>

<script>
  (function () {
    try {
      var p = location.pathname + location.search, k = 'fresh:' + p;
      if (sessionStorage.getItem(k)) return;
      Promise.all([
        fetch(p, { cache: 'force-cache' }).then(function (r) { return r.text(); }),
        fetch(p + (p.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); })
      ]).then(function (t) {
        if (t[0] !== t[1]) {
          sessionStorage.setItem(k, '1');
          fetch(p, { cache: 'reload' }).then(function () { location.reload(); });
        }
      }).catch(function () {});
    } catch (e) {}
  })();
</script>
</body>
</html>
