<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>生産スケジュール | IG Rod Planning</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #111; --sub: #555; --line: #ccc; --line2: #e2e2e2;
    --red: #cc2200; --bg: #f2f2f0; --paper: #ffffff;
    --done: #2e7d32; --done-bg: #eaf4ea;
    --warn: #c87c10; --warn-bg: #fbf1e0;
  }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; padding: 1.6rem 1.2rem 4rem; }

  .wrap { max-width: 1180px; margin: 0 auto; }

  .back-link { display: inline-block; margin-bottom: 0.6rem; font-size: 0.82rem; font-weight: 700; color: var(--sub); text-decoration: none; }
  .back-link:hover { color: var(--red); }

  header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid var(--ink); padding-bottom: 0.8rem; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 0.6rem; }
  header h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: 0.05em; }
  header .brand { font-size: 0.75rem; font-weight: 700; color: var(--sub); letter-spacing: 0.04em; }

  .search-box { margin-bottom: 1rem; }
  .search-box input { width: 100%; border: 2px solid var(--ink); background: var(--paper); font-family: inherit; font-size: 1rem; padding: 0.75rem 1rem; }
  .search-box input:focus { outline: none; border-color: var(--red); }

  .save-bar { background: var(--paper); border: 1px solid var(--line); padding: 0.9rem 1.1rem; margin-bottom: 1.2rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .save-bar p { font-size: 0.74rem; color: var(--sub); line-height: 1.6; }
  .save-bar .unsaved { color: var(--red); font-weight: 700; }
  .save-bar .auto { display: flex; align-items: center; gap: 0.4rem; font-size: 0.74rem; color: var(--sub); }
  .save-bar .buttons { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .save-btn { font-family: inherit; font-size: 0.85rem; font-weight: 700; padding: 0.6rem 1.3rem; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; white-space: nowrap; }
  .save-btn:hover { background: var(--red); border-color: var(--red); }
  .save-btn.secondary { background: #fff; color: var(--ink); }
  .save-btn.secondary:hover { background: #eee; border-color: var(--ink); color: var(--ink); }

  .add-box { background: var(--paper); border: 1px solid var(--line); padding: 1.1rem 1.2rem; margin-bottom: 1.4rem; }
  .add-box-title { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; color: var(--sub); margin-bottom: 0.7rem; text-transform: uppercase; }
  .add-grid { display: grid; grid-template-columns: 1fr 1.4fr 0.6fr 1.6fr auto; gap: 0.6rem; align-items: end; }
  .add-grid label { display: block; font-size: 0.65rem; font-weight: 700; color: var(--sub); margin-bottom: 0.3rem; }
  .add-grid input { width: 100%; border: 1px solid var(--line); background: var(--bg); font-family: inherit; font-size: 0.85rem; padding: 0.5rem 0.6rem; }
  .add-grid input:focus { outline: none; border-color: var(--red); background: #fff; }
  .add-btn { font-family: inherit; font-size: 0.85rem; font-weight: 700; padding: 0.55rem 1.3rem; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; white-space: nowrap; }
  .add-btn:hover { background: var(--red); border-color: var(--red); }

  .table-wrap { background: var(--paper); border: 1px solid var(--line); overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.84rem; min-width: 860px; }
  thead th { text-align: left; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em; color: #fff; background: var(--ink); padding: 0.6rem 0.7rem; white-space: nowrap; }
  tbody td { padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--line2); vertical-align: middle; }
  tbody tr.done { background: var(--done-bg); }
  tbody tr.done input { color: var(--sub); text-decoration: line-through; }
  td input[type="text"] { width: 100%; border: 1px solid transparent; background: transparent; font-family: inherit; font-size: 0.84rem; padding: 0.35rem 0.4rem; color: inherit; }
  td input[type="text"]:hover { border-color: var(--line); }
  td input[type="text"]:focus { outline: none; border-color: var(--red); background: #fff8e0; }
  td.col-date { width: 10%; } td.col-customer { width: 12%; } td.col-item { width: 14%; } td.col-confirmed { width: 10%; }
  td.col-qty { width: 5%; } td.col-qty input { text-align: center; } td.col-note { width: auto; }
  td.col-paint { width: 11%; } td.col-done { width: 4%; text-align: center; } td.col-del { width: 3%; text-align: center; }
  td.col-done input { width: 16px; height: 16px; cursor: pointer; }
  .del-btn { border: none; background: none; color: var(--sub); cursor: pointer; font-size: 1rem; line-height: 1; padding: 0.2rem 0.4rem; }
  .del-btn:hover { color: var(--red); }
  .empty-row td { text-align: center; color: var(--sub); padding: 2rem; font-size: 0.8rem; }

  .paint-select { width: 100%; border: 1px solid var(--line); background: var(--bg); color: var(--sub); font-family: inherit; font-size: 0.76rem; font-weight: 700; padding: 0.35rem 0.4rem; cursor: pointer; }
  .paint-select:focus { outline: none; }
  .paint-select.st-progress { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
  .paint-select.st-done { background: var(--done-bg); border-color: var(--done); color: var(--done); }

  .filter-row { display: flex; justify-content: flex-end; margin-bottom: 0.6rem; }
  .filter-row label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.76rem; color: var(--sub); cursor: pointer; }

  @media screen and (max-width: 760px) {
    .add-grid { grid-template-columns: 1fr 1fr; }
    .add-btn { grid-column: 1 / -1; }
    table { min-width: 760px; }
    td.col-date { width: 160px; }
    .save-bar { flex-direction: column; align-items: stretch; }
  }

  @media print {
    body { background: #fff; padding: 0; }
    .save-bar, .search-box, .add-box, .filter-row, .col-del, .del-btn, .back-link { display: none; }
    .wrap { max-width: 100%; }
    .table-wrap { border: none; }
    td input[type="text"] { background: transparent !important; }
    @page { size: A4 landscape; margin: 1cm; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <a class="back-link" href="schedule-docs.html">← スケジュールの選択へ</a>
    <header>
      <h1>生産スケジュール</h1>
      <div class="brand">IG Rod Planning ／ 社内共有用</div>
    </header>

    <div class="search-box">
      <input type="text" id="f-search" placeholder="顧客名・日付・概要などで検索（納期問い合わせの時に）">
    </div>

    <div class="save-bar">
      <div>
        <p id="save-status">読み込み中…</p>
        <label class="auto"><input type="checkbox" id="opt-autoreflect" checked> 保存したとき、納期希望リストにも反映する</label>
      </div>
      <div class="buttons">
        <button type="button" class="save-btn secondary" id="btn-reflect">納期希望リストへ反映</button>
        <button type="button" class="save-btn secondary" id="btn-print">印刷</button>
        <button type="button" class="save-btn secondary" id="btn-pdf">PDFとして保存</button>
        <button type="button" class="save-btn" id="btn-save">この内容を保存</button>
      </div>
    </div>

    <div class="add-box">
      <div class="add-box-title">新規追加</div>
      <div class="add-grid">
        <div>
          <label>出荷希望日</label>
          <input type="text" id="f-date" placeholder="例：2026/9/20、9月中旬">
        </div>
        <div>
          <label>顧客名</label>
          <input type="text" id="f-customer" placeholder="顧客名">
        </div>
        <div>
          <label>アイテム</label>
          <input type="text" id="f-item" placeholder="モデル名など">
        </div>
        <div>
          <label>本数</label>
          <input type="text" id="f-qty" value="1">
        </div>
        <div>
          <label>概要</label>
          <input type="text" id="f-note" placeholder="任意">
        </div>
        <button type="button" class="add-btn" id="btn-add">追加</button>
      </div>
    </div>

    <div class="filter-row">
      <label><input type="checkbox" id="f-hide-done" checked> 完了を隠す</label>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-date">出荷希望日</th>
            <th class="col-customer">顧客名</th>
            <th class="col-item">アイテム</th>
            <th class="col-confirmed">返答納期</th>
            <th class="col-qty">本数</th>
            <th class="col-note">概要</th>
            <th class="col-paint">塗装状況</th>
            <th class="col-done">完了</th>
            <th class="col-del"></th>
          </tr>
        </thead>
        <tbody id="rows-body">
          <tr class="empty-row"><td colspan="9">読み込み中…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="pdf-download.js"></script>
<script>
  var SYNC_API = 'https://ig-sync.pokugou.workers.dev';
  var rowsBody = document.getElementById('rows-body');
  var PAINT_OPTIONS = ['未着手', '塗装依頼済み', '塗装完了'];
  var rows = [];
  var hideDone = true;
  var dirty = false;
  var nextTempId = 1;

  function markDirty() {
    dirty = true;
    document.getElementById('save-status').innerHTML = '<span class="unsaved">未保存の変更があります。</span> 編集が終わったら右の「この内容を保存」を押してください。';
  }

  function markClean(text) {
    dirty = false;
    document.getElementById('save-status').textContent = text;
  }

  function buildRow(row) {
    var tr = document.createElement('tr');
    tr.className = row.done ? 'done' : '';

    function makeCell(cls, field) {
      var td = document.createElement('td');
      td.className = cls;
      var input = document.createElement('input');
      input.type = 'text';
      input.value = row[field] || '';
      input.addEventListener('input', function () {
        row[field] = input.value;
        markDirty();
      });
      td.appendChild(input);
      return td;
    }

    tr.appendChild(makeCell('col-date', 'date'));
    tr.appendChild(makeCell('col-customer', 'customer'));
    tr.appendChild(makeCell('col-item', 'item'));
    tr.appendChild(makeCell('col-confirmed', 'confirmed'));
    tr.appendChild(makeCell('col-qty', 'qty'));
    tr.appendChild(makeCell('col-note', 'note'));

    var paintTd = document.createElement('td');
    paintTd.className = 'col-paint';
    var paintSel = document.createElement('select');
    paintSel.className = 'paint-select';
    var paintVal = row.paint || PAINT_OPTIONS[0];
    PAINT_OPTIONS.forEach(function (opt) {
      var o = document.createElement('option');
      o.value = opt;
      o.textContent = opt;
      if (opt === paintVal) o.selected = true;
      paintSel.appendChild(o);
    });
    function applyPaintStyle() {
      paintSel.classList.toggle('st-progress', paintSel.value === '塗装依頼済み');
      paintSel.classList.toggle('st-done', paintSel.value === '塗装完了');
    }
    applyPaintStyle();
    paintSel.addEventListener('change', function () {
      applyPaintStyle();
      row.paint = paintSel.value;
      markDirty();
    });
    paintTd.appendChild(paintSel);
    tr.appendChild(paintTd);

    var doneTd = document.createElement('td');
    doneTd.className = 'col-done';
    var doneCb = document.createElement('input');
    doneCb.type = 'checkbox';
    doneCb.checked = !!row.done;
    doneCb.addEventListener('change', function () {
      row.done = doneCb.checked;
      markDirty();
      render();
    });
    doneTd.appendChild(doneCb);
    tr.appendChild(doneTd);

    var delTd = document.createElement('td');
    delTd.className = 'col-del';
    var delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'del-btn';
    delBtn.textContent = '✕';
    delBtn.title = '削除';
    delBtn.addEventListener('click', function () {
      if (!confirm('この行を削除しますか？')) return;
      rows = rows.filter(function (r) { return r !== row; });
      markDirty();
      render();
    });
    delTd.appendChild(delBtn);
    tr.appendChild(delTd);

    return tr;
  }

  var searchTerm = '';

  function matchesSearch(row) {
    if (!searchTerm) return true;
    return ['date', 'customer', 'item', 'confirmed', 'qty', 'note', 'paint'].some(function (f) {
      return (row[f] || '').toString().toLowerCase().indexOf(searchTerm) !== -1;
    });
  }

  function render() {
    var visible = rows.filter(function (r) { return !(hideDone && r.done) && matchesSearch(r); });
    if (visible.length === 0) {
      rowsBody.innerHTML = '<tr class="empty-row"><td colspan="9">' + (searchTerm ? '一致する行がありません' : 'まだ登録がありません') + '</td></tr>';
      return;
    }
    rowsBody.innerHTML = '';
    visible.forEach(function (row) { rowsBody.appendChild(buildRow(row)); });
  }

  document.getElementById('f-hide-done').addEventListener('change', function (e) {
    hideDone = e.target.checked;
    render();
  });

  document.getElementById('f-search').addEventListener('input', function (e) {
    searchTerm = e.target.value.trim().toLowerCase();
    render();
  });

  // 入口ページの検索から来たときは、その言葉で絞り込んだ状態で開く
  (function () {
    var m = /[?&]q=([^&]*)/.exec(location.search), v = m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : '';
    if (!v) return;
    document.getElementById('f-search').value = v;
    searchTerm = v.trim().toLowerCase();
  })();

  document.getElementById('btn-add').addEventListener('click', function () {
    var dateEl = document.getElementById('f-date');
    var customerEl = document.getElementById('f-customer');
    var qtyEl = document.getElementById('f-qty');
    var noteEl = document.getElementById('f-note');
    var itemEl = document.getElementById('f-item');
    var customer = customerEl.value.trim();
    var date = dateEl.value.trim();
    if (!customer && !date) {
      alert('出荷希望日か顧客名のどちらかは入力してください。');
      return;
    }
    rows.push({
      id: 'new-' + Date.now() + '-' + (nextTempId++),
      date: date,
      customer: customer,
      item: itemEl.value.trim(),
      confirmed: '',
      qty: qtyEl.value.trim() || '1',
      note: noteEl.value.trim(),
      paint: '未着手',
      done: false
    });
    dateEl.value = '';
    customerEl.value = '';
    itemEl.value = '';
    qtyEl.value = '1';
    noteEl.value = '';
    customerEl.focus();
    markDirty();
    render();
  });

  document.getElementById('btn-print').addEventListener('click', function () { window.print(); });

  document.getElementById('btn-pdf').addEventListener('click', async function () {
    var btn = this;
    var originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = '作成中…';
    var win = window.open('', '_blank');
    try { if (win) { win.document.write('<meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>生産スケジュール</title><p style="font:16px sans-serif;padding:2rem">PDFを作成中です…数秒お待ちください</p>'); win.document.close(); } } catch (e) {}
    try {
      var target = document.querySelector('.table-wrap');
      var canvas = await html2canvas(target, { scale: 2, backgroundColor: '#ffffff', windowWidth: 1100 });
      var pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });
      var pageW = pdf.internal.pageSize.getWidth();
      var pageH = pdf.internal.pageSize.getHeight();
      var margin = 8;
      var imgW = pageW - margin * 2;
      var pxPerMm = canvas.width / imgW;
      var pageContentPx = (pageH - margin * 2) * pxPerMm;

      var renderedPx = 0;
      var first = true;
      while (renderedPx < canvas.height) {
        var sliceH = Math.min(pageContentPx, canvas.height - renderedPx);
        var sliceCanvas = document.createElement('canvas');
        sliceCanvas.width = canvas.width;
        sliceCanvas.height = sliceH;
        sliceCanvas.getContext('2d').drawImage(canvas, 0, renderedPx, canvas.width, sliceH, 0, 0, canvas.width, sliceH);
        var imgData = sliceCanvas.toDataURL('image/jpeg', 0.92);
        var imgH = sliceH / pxPerMm;
        if (!first) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', margin, margin, imgW, imgH);
        renderedPx += sliceH;
        first = false;
      }
      var d = new Date();
      var name = '生産スケジュール_' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.pdf';
      if (win) { win.location.href = pdf.output('bloburl'); }
      if (window.showPdfDownload) showPdfDownload(pdf, name);
    } catch (e) {
      console.error(e);
      try { if (win) win.close(); } catch (e2) {}
      alert('PDFの作成に失敗しました。もう一度お試しください。');
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  });

  // 保存済みの納期希望リストのうち、この表の行とつながっている行（sid が一致）の顧客名・アイテム・本数・希望納期・返答納期・備考（概要）を更新する
  async function reflectToLists(sourceRows) {
    var res = await fetch(SYNC_API + '/paint?_=' + Date.now());
    if (!res.ok) throw new Error('load failed');
    var all = await res.json(), byId = {}, changedRows = 0, changedLists = 0;
    sourceRows.forEach(function (r) { byId[r.id] = r; });
    all.forEach(function (rec) {
      if (!rec.__delivery || !rec.sids || !rec.rows) return;
      var hit = false;
      rec.sids.forEach(function (sid, i) {
        var s = sid ? byId[sid] : null, cells = rec.rows[i];
        if (!s || !cells) return;
        var vals = [s.customer || '', s.item || '', s.qty == null ? '' : String(s.qty), s.date || '', s.confirmed || '', s.note || ''];
        var diff = vals.some(function (v, k) { return String(cells[k] == null ? '' : cells[k]) !== v; });
        if (!diff) return;
        vals.forEach(function (v, k) { cells[k] = v; });
        changedRows++; hit = true;
      });
      if (hit) changedLists++;
    });
    // まだどの納期希望リストにも入っていない未完了の行は、自動で作る「納期希望リスト」（dl-auto）にまとめる。完了した行・消した行はそこから外す
    var linked = {}, added = 0, removed = 0;
    all.forEach(function (rec) { if (rec.__delivery && rec.sids && rec.id !== 'dl-auto') rec.sids.forEach(function (sid) { if (sid) linked[sid] = true; }); });
    var auto = all.filter(function (rec) { return rec.__delivery && rec.id === 'dl-auto'; })[0];
    var cellsOf = function (r) { return [r.customer || '', r.item || '', r.qty == null ? '' : String(r.qty), r.date || '', r.confirmed || '', r.note || '']; };
    var keepRows = [], keepSids = [];
    if (auto) (auto.sids || []).forEach(function (sid, i) {
      var s = sid ? byId[sid] : null;
      if (sid && (!s || s.done || linked[sid])) { removed++; return; }
      keepRows.push(auto.rows[i]); keepSids.push(sid);
    });
    var have = {}; keepSids.forEach(function (sid) { if (sid) have[sid] = true; });
    sourceRows.forEach(function (r) {
      if (r.done || linked[r.id] || have[r.id] || !String(r.customer || '').trim() && !String(r.note || '').trim()) return;
      keepRows.push(cellsOf(r)); keepSids.push(r.id); added++;
    });
    if (added || removed) {
      if (!auto) { auto = { id: 'dl-auto', title: '納期希望リスト', date: new Date().toISOString().slice(0, 10), author: '' }; auto.__delivery = true; all.push(auto); }
      auto.rows = keepRows; auto.sids = keepSids; auto.savedAt = new Date().toISOString();
    }
    if (changedRows || added || removed) {
      var put = await fetch(SYNC_API + '/paint', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(all) });
      if (!put.ok) throw new Error('save failed');
    }
    return { rows: changedRows, lists: changedLists, added: added, removed: removed };
  }
  function reflectMessage(r) {
    var parts = [];
    if (r.rows) parts.push('保存済みのリスト ' + r.lists + ' 件（' + r.rows + ' 行）を更新');
    if (r.added) parts.push('未完了 ' + r.added + ' 行を追加');
    if (r.removed) parts.push('完了・削除した ' + r.removed + ' 行を外した');
    return parts.length ? '納期希望リストにも反映しました（' + parts.join('、') + '）。' : '納期希望リストは反映済みの内容と同じでした。';
  }

  try { document.getElementById('opt-autoreflect').checked = localStorage.getItem('schedule-autoreflect') !== '0'; } catch (e) {}
  document.getElementById('opt-autoreflect').addEventListener('change', function (e) { try { localStorage.setItem('schedule-autoreflect', e.target.checked ? '1' : '0'); } catch (x) {} });

  document.getElementById('btn-reflect').addEventListener('click', async function () {
    var btn = this, label = btn.textContent;
    if (dirty && !confirm('未保存の変更があります。いまの表の内容を納期希望リストに反映しますか？（生産スケジュール自体の保存は「この内容を保存」で行います）')) return;
    btn.disabled = true; btn.textContent = '反映中…';
    try {
      var r = await reflectToLists(rows);
      var el = document.getElementById('save-status'), keep = dirty;
      if (keep) el.innerHTML = '<span class="unsaved">未保存の変更があります。</span> ' + reflectMessage(r);
      else el.textContent = reflectMessage(r);
    } catch (e) {
      console.error(e);
      alert('納期希望リストへの反映に失敗しました。通信状況を確認してもう一度お試しください。');
    } finally { btn.disabled = false; btn.textContent = label; }
  });

  document.getElementById('btn-save').addEventListener('click', async function () {
    var btn = this;
    var originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = '保存中…';
    try {
      var res = await fetch(SYNC_API + '/schedule', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(rows)
      });
      if (!res.ok) throw new Error('sync failed');
      markClean('保存しました。');
      if (document.getElementById('opt-autoreflect').checked) {
        try { markClean('保存しました。' + reflectMessage(await reflectToLists(rows))); }
        catch (e3) { console.error(e3); markClean('保存しました。（納期希望リストへの反映は失敗しました。「納期希望リストへ反映」で再度お試しください）'); }
      }
    } catch (e) {
      console.error(e);
      var blob = new Blob([JSON.stringify(rows, null, 2)], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      var d = new Date();
      var stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
      a.href = url;
      a.download = 'schedule-save-' + stamp + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      alert('保存の自動反映に失敗しました。代わりにファイルをダウンロードしたので、Claudeに伝えて反映してもらってください。');
    } finally {
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  });

  window.addEventListener('beforeunload', function (e) {
    if (!dirty) return;
    e.preventDefault();
    e.returnValue = '';
  });

  fetch(SYNC_API + '/schedule?_=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (data) {
      rows = data;
      markClean(rows.length + '件を表示中');
      render();
    })
    .catch(function (e) {
      console.error(e);
      markClean('データの読み込みに失敗しました。');
    });
</script>

<script src="arrow-nav.js"></script>
</body>
</html>
