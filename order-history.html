<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>受注シート一覧 | IG Rod Planning</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #111; --sub: #555; --line: #ccc; --line2: #e2e2e2;
    --red: #cc2200; --bg: #f2f2f0; --paper: #ffffff;
  }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; padding: 1.6rem 1.2rem 4rem; }

  .wrap { max-width: 860px; margin: 0 auto; }

  .back-link { display: inline-block; margin-bottom: 0.6rem; font-size: 0.82rem; font-weight: 700; color: var(--sub); text-decoration: none; }
  .back-link:hover { color: var(--red); }

  header { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid var(--ink); padding-bottom: 0.8rem; margin-bottom: 1rem; flex-wrap: wrap; gap: 0.6rem; }
  header h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: 0.05em; }
  header .brand { font-size: 0.75rem; font-weight: 700; color: var(--sub); letter-spacing: 0.04em; }

  .search-box { margin-bottom: 1rem; }
  .search-box input { width: 100%; border: 2px solid var(--ink); background: var(--paper); font-family: inherit; font-size: 1rem; padding: 0.75rem 1rem; }
  .search-box input:focus { outline: none; border-color: var(--red); }

  .status-line { font-size: 0.74rem; color: var(--sub); margin-bottom: 1.2rem; }

  .select-bar { display: none; background: var(--paper); border: 1px solid var(--line); padding: 0.7rem 1rem; margin-bottom: 1rem; align-items: center; justify-content: space-between; gap: 1rem; }
  .select-bar.active { display: flex; }
  .select-bar span { font-size: 0.8rem; color: var(--sub); }
  .select-bar button { font-family: inherit; font-size: 0.82rem; font-weight: 700; color: #fff; background: var(--ink); border: 1px solid var(--ink); padding: 0.55rem 1.1rem; cursor: pointer; white-space: nowrap; }
  .select-bar button:hover { background: var(--red); border-color: var(--red); }

  .order-card { background: var(--paper); border: 1px solid var(--line); margin-bottom: 0.8rem; }
  .order-summary { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 0.9rem 1.1rem; cursor: pointer; }
  .order-summary:hover { background: #fafafa; }
  .order-summary .pick { width: 17px; height: 17px; flex-shrink: 0; cursor: pointer; }
  .order-summary .who { font-weight: 700; font-size: 0.95rem; flex: 1; }
  .order-summary .when { font-size: 0.75rem; color: var(--sub); white-space: nowrap; }
  .order-summary .arrow { font-size: 0.7rem; color: var(--sub); transition: transform 0.15s; flex-shrink: 0; }
  .order-card.open .arrow { transform: rotate(90deg); }

  .order-detail { display: none; border-top: 1px solid var(--line2); padding: 1rem 1.1rem 1.2rem; }
  .order-card.open .order-detail { display: block; }

  .detail-actions { display: flex; gap: 0.6rem; margin-bottom: 1rem; }
  .edit-btn { flex: 1; font-family: inherit; font-size: 0.82rem; font-weight: 700; color: #fff; background: var(--ink); border: 1px solid var(--ink); padding: 0.6rem 1rem; cursor: pointer; }
  .edit-btn:hover { background: var(--red); border-color: var(--red); }
  .delete-btn { font-family: inherit; font-size: 0.82rem; font-weight: 700; color: var(--sub); background: #fff; border: 1px solid var(--line); padding: 0.6rem 1rem; cursor: pointer; white-space: nowrap; }
  .delete-btn:hover { color: #fff; background: var(--red); border-color: var(--red); }

  .detail-section { margin-bottom: 1.1rem; }
  .detail-section:last-child { margin-bottom: 0; }
  .detail-section-title { font-size: 0.62rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: #fff; background: var(--ink); display: inline-block; padding: 0.2rem 0.6rem; margin-bottom: 0.5rem; }
  .detail-row { display: grid; grid-template-columns: 140px 1fr; align-items: baseline; gap: 0.6rem; padding: 0.35rem 0; border-bottom: 1px dotted var(--line2); font-size: 0.84rem; }
  .detail-row .dl { font-weight: 700; color: var(--sub); }
  .detail-row .dv { white-space: pre-wrap; }

  .empty { text-align: center; color: var(--sub); padding: 3rem 1rem; font-size: 0.85rem; }

  .print-sheets { position: fixed; top: 0; left: -9999px; width: 800px; }
  .print-sheets .sheet { background: var(--paper); border: 1px solid var(--line2); padding: 2.2rem 2.5rem 2.6rem; margin-bottom: 1.5rem; }
  .print-sheets .sheet-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid var(--ink); padding-bottom: 0.8rem; margin-bottom: 1.4rem; }
  .print-sheets .sheet-head h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: 0.06em; }
  .print-sheets .sheet-no { display: flex; align-items: baseline; gap: 0.3rem; font-size: 0.85rem; font-weight: 700; color: var(--red); margin-bottom: 0.6rem; }
  .print-sheets .sheet-no input { width: 16em; border: none; border-bottom: 1px solid var(--red); background: transparent; font-family: inherit; font-size: inherit; font-weight: inherit; color: inherit; padding: 0.05rem 0.2rem; }
  .print-sheets .sheet-head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }
  .print-sheets .sheet-head .brand { font-size: 0.75rem; font-weight: 700; color: var(--sub); letter-spacing: 0.04em; }
  .print-sheets .meta-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; margin-bottom: 1.4rem; }
  .print-sheets .meta-item label { display: block; font-size: 0.65rem; font-weight: 700; color: var(--sub); letter-spacing: 0.05em; margin-bottom: 0.25rem; }
  .print-sheets .meta-item input, .print-sheets .meta-item select { width: 100%; border: none; border-bottom: 1px solid var(--line); font-family: inherit; font-size: 0.85rem; padding: 0.25rem 0.1rem; background: transparent; }
  .print-sheets .section { margin-bottom: 1.3rem; }
  .print-sheets .section-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; color: #fff; background: var(--ink); display: inline-block; padding: 0.25rem 0.7rem; margin-bottom: 0.7rem; }
  .print-sheets .row { display: grid; grid-template-columns: 130px 1fr; align-items: baseline; gap: 0.6rem; padding: 0.35rem 0; border-bottom: 1px dotted var(--line2); }
  .print-sheets .row label { font-size: 0.78rem; font-weight: 700; color: var(--sub); }
  .print-sheets .row input, .print-sheets .row select, .print-sheets .row textarea { width: 100%; border: none; font-family: inherit; font-size: 0.85rem; padding: 0.15rem 0.1rem; background: transparent; }
  .print-sheets .row textarea { resize: vertical; min-height: 2.4em; line-height: 1.5; }
  .print-sheets .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.5rem; }
  .print-sheets .cols2 .row { grid-template-columns: 132px 1fr; }
  .print-sheets .memo-box { border: 1px solid var(--line2); min-height: 3.4em; padding: 0.5rem 0.6rem; }
  .print-sheets .memo-box textarea { width: 100%; height: 100%; min-height: 3rem; border: none; font-family: inherit; font-size: 0.85rem; resize: vertical; background: transparent; }
  .print-sheets .hint { font-size: 0.68rem; color: var(--sub); margin-top: 0.2rem; }

  @media (max-width: 560px) {
    .detail-row { grid-template-columns: 1fr; gap: 0.1rem; padding: 0.4rem 0; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <a class="back-link" href="history.html">← 戻る</a>
    <header>
      <h1>受注シート一覧</h1>
      <div class="brand">IG Rod Planning ／ 社内共有用</div>
    </header>

    <div class="search-box">
      <input type="text" id="f-search" placeholder="顧客名などで検索（納期問い合わせの時に）">
    </div>

    <p class="status-line" id="status-line">読み込み中…</p>

    <div class="select-bar" id="select-bar">

      <button type="button" id="btn-pdf">選択した内容をまとめてPDF保存</button>
    </div>

    <div id="list"></div>
  </div>

  <div class="print-sheets" id="print-sheets"></div>

  <template id="sheet-template">
  <div class="sheet">

    <span class="sheet-no">No.<input type="text" class="sheet-no-input" value="1"></span>

    <div class="sheet-head">
      <h1>受注シート</h1>

      <div class="meta-item">
        <label>受付担当</label>
        <select>

        </select>

    <div class="section">

            <option>GTLJ63ULB（ベイト）</option>
            <option>GTLJ63LB（ベイト）</option>
            <option>GTLJ63MB（ベイト）</option>
            <option>GTLJ63ULS（スピニング）</option>

            <option>GTSLJ62UL-B（ベイト）</option>

  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  var allRecords = [];
  var searchTerm = '';
  var selected = {};

  var SECTIONS = [
    { title: '基本情報', fields: ['No.', '受注日', '希望納期', '受付方法', '受付担当'] },
    { title: 'お客様情報', fields: ['お名前', 'お客様名', '電話番号', '発送方法', '送り先住所'] },
    { title: 'ベースモデル', fields: ['モデル選択', 'モデル（入力）', '本数'] },
    { title: 'カラーカスタム', fields: ['ブランクスカラー', 'ティップカラー', 'リールシート', 'メインスレッド', 'ティップ部分スレッド', 'ピンライン'] },
    { title: 'カスタムオプション', fields: ['ガイド仕様', 'ガイド仕様（入力）', 'ガイドレイアウト', 'グリップ仕様', 'ネーム仕様', 'ネーム内容'] },
    { title: 'こだわり・備考', fields: ['こだわり・備考'] }
  ];

  function buildDetail(record) {
    var wrap = document.createElement('div');
    var used = {};

    SECTIONS.forEach(function (section) {
      var present = section.fields.filter(function (f) { return record[f]; });
      if (present.length === 0) return;
      var sec = document.createElement('div');
      sec.className = 'detail-section';
      var title = document.createElement('div');
      title.className = 'detail-section-title';
      title.textContent = section.title;
      sec.appendChild(title);
      present.forEach(function (f) {
        sec.appendChild(makeRow(f, record[f]));
        used[f] = true;
      });
      wrap.appendChild(sec);
    });

    var rest = Object.keys(record).filter(function (k) { return !used[k] && k.indexOf('__') !== 0; });
    if (rest.length > 0) {
      var sec = document.createElement('div');
      sec.className = 'detail-section';
      var title = document.createElement('div');
      title.className = 'detail-section-title';
      title.textContent = 'その他';
      sec.appendChild(title);
      rest.forEach(function (k) { sec.appendChild(makeRow(k, record[k])); });
      wrap.appendChild(sec);
    }

    return wrap;
  }

  function makeRow(label, value) {
    var row = document.createElement('div');
    row.className = 'detail-row';
    var dl = document.createElement('span');
    dl.className = 'dl';
    dl.textContent = label;
    var dv = document.createElement('span');
    dv.className = 'dv';
    dv.textContent = value;
    row.appendChild(dl);
    row.appendChild(dv);
    return row;
  }

  function matchesSearch(record) {
    if (!searchTerm) return true;
    return Object.keys(record).some(function (k) {
      if (k.indexOf('__') === 0) return false;
      return (record[k] || '').toString().toLowerCase().indexOf(searchTerm) !== -1;
    });
  }

  function render() {
    var list = document.getElementById('list');
    var visible = allRecords.filter(matchesSearch);
    var statusText;
    if (allRecords.length === 0) {
      statusText = 'まだ記録がありません';
    } else if (searchTerm) {
      statusText = visible.length + '件 / 全' + allRecords.length + '件';
    } else {
      statusText = allRecords.length + '件';
    }
    document.getElementById('status-line').textContent = statusText;
    if (visible.length === 0) {
      list.innerHTML = '<p class="empty">' + (searchTerm ? '一致する受注がありません' : 'まだ受注の記録がありません') + '</p>';
      return;
    }
    list.innerHTML = '';
    visible.forEach(function (record, i) {
      var card = document.createElement('div');
      card.className = 'order-card';

      var summary = document.createElement('div');
      summary.className = 'order-summary';
      var pick = document.createElement('input');
      pick.type = 'checkbox';
      pick.className = 'pick';
      pick.checked = !!selected[record.__id];
      pick.addEventListener('click', function (e) { e.stopPropagation(); });
      pick.addEventListener('change', function () {
        if (pick.checked) selected[record.__id] = true;
        else delete selected[record.__id];
        updateSelectBar();
      });
      var who = document.createElement('span');
      who.className = 'who';
      who.textContent = (record['お名前'] || record['お客様名'] || '(名前未記入)') + (record['モデル選択'] ? '　' + record['モデル選択'] : '');
      var when = document.createElement('span');
      when.className = 'when';
      when.textContent = record['受注日'] || '';
      var arrow = document.createElement('span');
      arrow.className = 'arrow';
      arrow.textContent = '▶';
      summary.appendChild(pick);
      summary.appendChild(who);
      summary.appendChild(when);
      summary.appendChild(arrow);
      summary.addEventListener('click', function () { card.classList.toggle('open'); });

      var detail = document.createElement('div');
      detail.className = 'order-detail';
      var actions = document.createElement('div');
      actions.className = 'detail-actions';
      var editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'edit-btn';
      editBtn.textContent = 'この内容を受注シートで編集する →';
      editBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        localStorage.setItem('order-sheet-reload', JSON.stringify(record));
        location.href = 'order-sheet.html?reload=1';
      });
      var deleteBtn = document.createElement('button');
      deleteBtn.type = 'button';
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = 'この記録を削除';
      deleteBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!confirm((record['お名前'] || record['お客様名'] || 'この記録') + 'を削除しますか？\n削除後に自動でダウンロードされるファイルをClaudeに伝えると、一覧から消えます。')) return;
        delete selected[record.__id];
        allRecords = allRecords.filter(function (r) { return r.__id !== record.__id; });
        downloadUpdatedArchive();
        updateSelectBar();
        render();
      });
      actions.appendChild(editBtn);
      actions.appendChild(deleteBtn);
      detail.appendChild(actions);
      detail.appendChild(buildDetail(record));

      card.appendChild(summary);
      card.appendChild(detail);
      list.appendChild(card);
    });
  }

  document.getElementById('f-search').addEventListener('input', function (e) {
    searchTerm = e.target.value.trim().toLowerCase();
    render();
  });

  function updateSelectBar() {
    var count = Object.keys(selected).length;
    var bar = document.getElementById('select-bar');
    bar.classList.toggle('active', count > 0);
    document.getElementById('select-count').textContent = count + '件選択中';
  }

  function downloadUpdatedArchive() {
    var clean = allRecords.slice().reverse().map(function (r) {
      var copy = {};
      Object.keys(r).forEach(function (k) { if (k.indexOf('__') !== 0) copy[k] = r[k]; });
      return copy;
    });
    var blob = new Blob([JSON.stringify(clean, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date();
    var stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
    a.href = url;
    a.download = 'orders-archive-updated-' + stamp + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function slashToIso(s) {
    var parts = (s || '').split('/');
    if (parts.length !== 3) return '';
    return parts[0] + '-' + String(parts[1]).padStart(2, '0') + '-' + String(parts[2]).padStart(2, '0');
  }

  function setFieldValue(field, value) {
    if (field.tagName === 'SELECT') {
      var match = Array.from(field.options).find(function (o) {
        return o.value === value || o.textContent.trim() === value;
      });
      if (match) field.value = match.value;
    } else if (field.type === 'date') {
      field.value = slashToIso(value);
    } else {
      field.value = value;
    }
  }

  function buildPrintSheet(record) {
    var frag = document.getElementById('sheet-template').content.cloneNode(true);
    var sheet = frag.querySelector('.sheet');

    sheet.querySelectorAll('.meta-item, .row').forEach(function (container) {
      var label = container.querySelector('label');
      var field = container.querySelector('input, select, textarea');
      if (!label || !field) return;
      var key = label.textContent.trim();
      if (record[key] === undefined) return;
      setFieldValue(field, record[key]);
      if (field.tagName === 'SELECT' && field.value === '入力') {
        var customRow = container.nextElementSibling;
        if (customRow) customRow.style.display = '';
      }
      if (field.tagName === 'SELECT' && field.value === 'その他') {
        var customRow2 = container.nextElementSibling;
        if (customRow2) customRow2.style.display = '';
      }
    });
    if (record['No.']) sheet.querySelector('.sheet-no-input').value = record['No.'];
    if (record['こだわり・備考']) sheet.querySelector('.memo-box textarea').value = record['こだわり・備考'];

    return sheet;
  }

  document.getElementById('btn-pdf').addEventListener('click', async function () {
    var ids = Object.keys(selected);
    if (ids.length === 0) return;
    var records = allRecords.filter(function (r) { return selected[r.__id]; });

    var btn = this;
    var originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = '作成中…';
    var container = document.getElementById('print-sheets');
    container.innerHTML = '';
    records.forEach(function (r) { container.appendChild(buildPrintSheet(r)); });

    try {
      var pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
      var pageW = pdf.internal.pageSize.getWidth();
      var pageH = pdf.internal.pageSize.getHeight();
      var margin = 8;
      var sheetEls = container.querySelectorAll('.sheet');
      for (var i = 0; i < sheetEls.length; i++) {
        var canvas = await html2canvas(sheetEls[i], { scale: 2, backgroundColor: '#ffffff', windowWidth: 900 });
        var imgData = canvas.toDataURL('image/jpeg', 0.92);
        var imgW = pageW - margin * 2;
        var imgH = imgW * canvas.height / canvas.width;
        if (imgH > pageH - margin * 2) {
          imgH = pageH - margin * 2;
          imgW = imgH * canvas.width / canvas.height;
        }
        if (i > 0) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', (pageW - imgW) / 2, margin, imgW, imgH);
      }
      var d = new Date();
      pdf.save('受注シート一覧_' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '.pdf');
    } catch (e) {
      console.error(e);
      alert('PDFの作成に失敗しました。もう一度お試しください。');
    } finally {
      container.innerHTML = '';
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  });

  fetch('./orders-archive.json?_=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error('not found'); return r.json(); })
    .then(function (data) {
      allRecords = data.slice().reverse();
      allRecords.forEach(function (r, i) { r.__id = i; });
      render();
    })
    .catch(function () {
      allRecords = [];
      render();
    });
</script>

</body>
</html>
