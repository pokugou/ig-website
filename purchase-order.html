<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>注文書（発注書）| 株式会社IG</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink: #111; --sub: #555; --line: #999; --line2: #d6d6d6; --zebra: #f6f6f3; --red: #cc2200; --bg: #f2f2f0; --paper: #fff; }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; padding: 1.6rem 1rem 4rem; }

  .toolbar { max-width: 794px; margin: 0 auto 0.8rem; display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
  .toolbar .back { margin-right: auto; font-size: 0.82rem; font-weight: 700; color: var(--sub); text-decoration: none; }
  .toolbar .back:hover { color: var(--red); }
  .toolbar button { font-family: inherit; font-size: 0.85rem; font-weight: 700; padding: 0.6rem 1.2rem; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
  .toolbar button:hover { background: var(--red); border-color: var(--red); }
  .toolbar button.secondary { background: #fff; color: var(--ink); }
  .toolbar button.secondary:hover { background: #eee; color: var(--ink); border-color: var(--ink); }
  .sender-pick { max-width: 794px; margin: 0 auto 0.6rem; display: flex; flex-wrap: wrap; row-gap: 0.4rem; align-items: center; gap: 0.6rem; font-size: 0.82rem; font-weight: 700; }
  .sender-pick select { font-family: inherit; font-size: 0.85rem; font-weight: 700; padding: 0.45rem 0.6rem; border: 1px solid var(--ink); background: #fff; }
  .pdf-capture .sender-pick { display: none; }
  @media print { .sender-pick { display: none; } .company ::placeholder { color: transparent; } }
  .hint { max-width: 794px; margin: 0 auto 1rem; font-size: 0.72rem; color: var(--sub); }

  .sheet { width: 794px; max-width: 100%; margin: 0 auto; background: var(--paper); border: 1px solid #ddd; padding: 2.4rem 2.6rem 2.2rem; }
  .sheet input, .sheet textarea { font-family: inherit; color: inherit; background: transparent; border: none; width: 100%; }
  .sheet input:focus, .sheet textarea:focus { outline: none; background: #fff8e0; }
  .sheet ::placeholder { color: #bbb; }

  /* 見出し */
  .doc-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; border-bottom: 3px solid var(--ink); padding-bottom: 0.6rem; margin-bottom: 1.4rem; }
  .doc-head h1 { font-size: 1.9rem; font-weight: 900; letter-spacing: 0.25em; line-height: 1.4; }
  .doc-head .en { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.35em; color: var(--sub); }
  .meta { display: grid; grid-template-columns: auto 9.5rem; column-gap: 0.7rem; row-gap: 0.15rem; font-size: 0.8rem; align-items: baseline; }
  .meta .k { color: var(--sub); font-weight: 700; text-align: right; }
  .meta input { text-align: right; font-weight: 700; font-size: 0.8rem; padding: 0.05rem 0.1rem; }

  /* 発注先・差出人 */
  .head { display: grid; grid-template-columns: 1fr 16.5rem; gap: 2rem; align-items: start; margin-bottom: 1.3rem; }
  .to { display: flex; align-items: baseline; gap: 0.5rem; border-bottom: 2px solid var(--ink); padding-bottom: 0.15rem; }
  .to input { font-size: 1.35rem; font-weight: 900; padding: 0.1rem; }
  .to span { font-size: 1.05rem; font-weight: 700; white-space: nowrap; }
  .greet { margin-top: 0.8rem; font-size: 0.8rem; line-height: 1.8; }
  .company { font-size: 0.76rem; line-height: 1.65; }
  .company .brand { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.35rem; }
  .company .brand img { width: 42px; height: 42px; display: block; flex: 0 0 auto; }
  .no-logo .company .brand img { display: none; }
  .company textarea { font-size: 0.76rem; line-height: 1.65; resize: none; overflow: hidden; display: block; }
  .company input.name { font-size: 1.1rem; font-weight: 900; letter-spacing: 0.03em; display: block; }
  .company input.tel { font-size: 0.82rem; font-weight: 700; display: block; }

  /* 明細 */
  table.items { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.items th { background: var(--ink); color: #fff; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; padding: 0.35rem 0.2rem; }
  table.items td { border-bottom: 1px solid var(--line2); padding: 0; font-size: 0.85rem; height: 2rem; }
  table.items tbody tr:nth-child(even) td { background: var(--zebra); }
  table.items td.no { text-align: center; font-size: 0.72rem; color: var(--sub); width: 2.6rem; }
  table.items th:nth-child(1) { width: 2.6rem; }
  table.items th:nth-child(3) { width: 5.6rem; }
  table.items th:nth-child(4) { width: 5.6rem; }
  table.items th:nth-child(5) { width: 6rem; }
  table.items th:nth-child(6) { width: 7.4rem; }
  table.items td input { padding: 0.3rem 0.45rem; font-size: 0.9rem; }
  table.items td.qty input { text-align: center; font-weight: 900; font-size: 1rem; }
  table.items td.price input { text-align: right; font-size: 0.8rem; }
  table.items td.jan input, table.items td.due input { font-size: 0.78rem; text-align: center; }

  /* 備考 */
  .note { margin-top: 1rem; border: 1px solid var(--line2); }
  .note .k { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; color: var(--sub); padding: 0.45rem 0.8rem 0; }
  .note-box { min-height: 14rem; padding: 0.3rem 0.8rem 0.7rem; }
  .note-box textarea { font-size: 0.92rem; line-height: 1.7; resize: vertical; min-height: 13rem; height: 100%; }

  .add-row { max-width: 794px; margin: 0.6rem auto 0; }
  .add-row button { font-family: inherit; font-size: 0.8rem; font-weight: 700; padding: 0.55rem 1rem; width: 100%; border: 1px dashed var(--line); background: transparent; color: var(--sub); cursor: pointer; }
  .add-row button:hover { border-color: var(--ink); color: var(--ink); border-style: solid; }

  @media screen and (max-width: 640px) {
    .sheet { padding: 1.3rem 0.9rem 1.5rem; }
    .doc-head { flex-direction: column; align-items: stretch; }
    .meta { grid-template-columns: auto 1fr; }
    .head { grid-template-columns: 1fr; gap: 1.2rem; }
    .items-wrap { overflow-x: auto; }
    table.items { min-width: 600px; }
    table.items td input { padding: 0.35rem 0.25rem; font-size: 0.85rem; }
  }

  .pdf-capture .sheet { width: 794px; max-width: none; border: none; }
  .pdf-capture .doc-head { flex-direction: row; align-items: flex-end; }
  .pdf-capture .meta { grid-template-columns: auto 9.5rem; }
  .pdf-capture .head { grid-template-columns: 1fr 16.5rem; gap: 2rem; }
  .pdf-capture .items-wrap { overflow: visible; }
  .pdf-capture .toolbar, .pdf-capture .add-row, .pdf-capture .hint { display: none; }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar, .add-row, .hint { display: none; }
    .sheet { width: 100%; border: none; padding: 0; }
    table.items th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    table.items tbody tr:nth-child(even) td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: A4; margin: 1.2cm; }
  }
</style>
</head>
<body>

  <div class="toolbar">
    <a class="back" href="documents.html">← 書類トップ</a>
    <a class="back" style="margin-right:0;color:var(--ink);border:1px solid var(--ink);padding:0.6rem 1rem;background:#fff" href="purchase-order-history.html">保存一覧</a>
    <button type="button" class="secondary" id="btn-reset">クリア</button>
    <button type="button" class="secondary" id="btn-print">印刷</button>
    <button type="button" id="btn-save">PDFとして保存</button>
  </div>
  <div class="sender-pick">
    <label for="f-sender">右上の差出人</label>
    <select id="f-sender">
      <option value="ig">株式会社IG（通常）</option>
      <option value="tamesada">tamesada（直送）</option>
      <option value="custom">自由入力</option>
      <option value="blank">空欄（何も載せない）</option>
    </select>
    <label for="f-ship" style="margin-left:0.8rem">下の送り先</label>
    <select id="f-ship">
      <option value="">なし</option>
      <option value="ig">株式会社IG</option>
      <option value="tamesada">tamesada</option>
      <option value="custom">自由入力</option>
    </select>
  </div>
  <p class="hint">仕入先ごとの注文書です。品名・実質数量・備考を入力して「PDFとして保存」すると、A4の1枚で出力されます。</p>

  <div class="sheet" id="sheet">
    <div class="doc-head">
      <div>
        <h1>注文書</h1>
        <div class="en">PURCHASE ORDER</div>
      </div>
      <div class="meta">
        <span class="k">作成日</span><input type="date" id="f-date">
        <span class="k">作成者</span><input type="text" id="f-author" value="石谷 豪">
      </div>
    </div>

    <div class="head">
      <div>
        <div class="to"><input type="text" id="f-to" placeholder="発注先（例：株式会社ファイブコア）"><span>御中</span></div>
        <div class="greet">平素より格別の御高配誠にありがとうございます。<br>下記商品の御手配をお願い致します。</div>
      </div>
      <div class="company">
        <div class="brand"><img src="logo.png" alt=""><input type="text" class="name" id="f-company" placeholder="名前・会社名"></div>
        <textarea id="f-addr" rows="3" placeholder="〒・住所"></textarea>
        <input type="text" class="tel" id="f-tel" placeholder="TEL">
      </div>
    </div>

    <div class="items-wrap">
      <table class="items">
        <thead><tr><th>No.</th><th>品名</th><th>実質数量</th><th>単価</th><th>JAN下6桁</th><th>希望納期</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>

    <div class="note">
      <div class="k">備考</div>
      <div class="note-box"><textarea id="f-note" placeholder="※在庫がないものは注残なしでお願いします など"></textarea></div>
    </div>
  </div>

  <div class="add-row"><button type="button" id="btn-add">＋ 行を追加</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  var rowsEl = document.getElementById('rows');

  // 明細の入力欄をキーボードで移動：↑↓（Enter）で上下の行、←→は文字の端で隣の欄へ。日本語変換中は何もしない
  function enableArrowNav(tbody) {
    tbody.addEventListener('keydown', function (e) {
      if (e.isComposing || e.keyCode === 229 || e.altKey || e.ctrlKey || e.metaKey) return;
      var el = e.target;
      if (el.tagName !== 'INPUT') return;
      var tr = el.closest('tr');
      var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
      var cells = Array.prototype.slice.call(tr.querySelectorAll('input'));
      var r = rows.indexOf(tr), c = cells.indexOf(el), target = null, atStart = false;
      var noSel = el.selectionStart === el.selectionEnd;
      if (e.key === 'ArrowUp' || (e.key === 'Enter' && e.shiftKey)) {
        if (rows[r - 1]) target = rows[r - 1].querySelectorAll('input')[c];
      } else if (e.key === 'ArrowDown' || e.key === 'Enter') {
        if (rows[r + 1]) target = rows[r + 1].querySelectorAll('input')[c];
      } else if (e.key === 'ArrowLeft' && noSel && el.selectionStart === 0) {
        target = cells[c - 1] || (rows[r - 1] && Array.prototype.slice.call(rows[r - 1].querySelectorAll('input')).pop());
      } else if (e.key === 'ArrowRight' && noSel && el.selectionEnd === el.value.length) {
        target = cells[c + 1] || (rows[r + 1] && rows[r + 1].querySelector('input'));
        atStart = true;
      } else {
        return;
      }
      if (e.key === 'Enter') e.preventDefault();
      if (!target) return;
      e.preventDefault();
      target.focus();
      var pos = atStart ? 0 : target.value.length;
      try { target.setSelectionRange(pos, pos); } catch (err) {}
    });
  }
  enableArrowNav(rowsEl);
  var STORE_KEY = 'purchase-order-draft';
  var SYNC_API = 'https://ig-sync.pokugou.workers.dev';
  var currentId = null;

  var DEF_ADDR = '〒188-0004\n東京都西東京市西原町\n5-3-30パルシオⅡ301';
  var DEF_COMPANY = '株式会社IG';
  var DEF_TEL = 'TEL.09017985613';
  var SENDERS = {
    ig: { addr: DEF_ADDR, company: DEF_COMPANY, tel: DEF_TEL },
    tamesada: { addr: '〒750-0092\n山口県下関市彦島迫町4-11-6', company: 'tamesada', tel: 'TEL.090-5379-7835' }
  };
  // 備考欄の「送り先」ブロック。備考のほかの文章は残し、このブロックだけ入れ替える
  var SHIP_BLOCKS = {
    ig: '送り先\n〒188-0004\n東京都西東京市西原町5-3-30パルシオⅡ301\n株式会社IG 石谷 豪\nTEL.090-1798-5613',
    tamesada: '送り先\n〒750-0092\n山口県下関市彦島迫町4-11-6\ntamesada\nTEL.090-5379-7835',
    custom: '送り先\n〒'
  };
  function currentShipBlock(note) {
    var hit = '';
    ['ig', 'tamesada'].forEach(function (k) { if (!hit && note.indexOf(SHIP_BLOCKS[k]) !== -1) hit = k; });
    return hit;
  }
  function syncShipPick() {
    var note = document.getElementById('f-note').value;
    document.getElementById('f-ship').value = currentShipBlock(note) || (/(^|\n)送り先/.test(note) ? 'custom' : '');
  }
  // 備考の最後にある「送り先」段落（空行を含まないまとまり）を返す
  function tailShipBlock(note) {
    var m = note.replace(/\n+$/, '').match(/(^|\n)(送り先[^\n]*(?:\n(?!\n)[^\n]*)*)$/);
    return m ? m[2] : '';
  }
  function setShip(kind) {
    var el = document.getElementById('f-note');
    var note = el.value.replace(/\n+$/, ''), tail = tailShipBlock(note);
    if (tail) {
      var known = tail === SHIP_BLOCKS.ig || tail === SHIP_BLOCKS.tamesada || tail === SHIP_BLOCKS.custom;
      if (!known && !confirm('備考欄の今の送り先を置き換えますか？\n\n' + tail)) { syncShipPick(); return; }
      note = note.slice(0, note.length - tail.length);
    }
    note = note.replace(/\n{3,}/g, '\n\n').replace(/^\n+|\n+$/g, '');
    if (kind) note = (note ? note + '\n\n' : '') + SHIP_BLOCKS[kind];
    el.value = note;
    if (kind === 'custom') { el.focus(); el.setSelectionRange(note.length, note.length); }
  }

  function senderNow() {
    return { addr: document.getElementById('f-addr').value, company: document.getElementById('f-company').value, tel: document.getElementById('f-tel').value };
  }
  function syncSenderPick() {
    var n = senderNow(), pick = 'custom';
    if (!n.addr.trim() && !n.company.trim() && !n.tel.trim()) pick = 'blank';
    Object.keys(SENDERS).forEach(function (k) {
      var v = SENDERS[k];
      if (n.addr === v.addr && n.company === v.company && n.tel === v.tel) pick = k;
    });
    document.getElementById('f-sender').value = pick;
    document.body.classList.toggle('no-logo', pick !== 'ig');
    fitAddr();
  }
  function fitAddr() {
    var a = document.getElementById('f-addr');
    a.rows = Math.max(1, a.value.split('\n').length);
  }
  var DEFAULT_DUE = '最短納期希望';

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function addRow(v) {
    v = v || {};
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="no"></td>' +
      '<td class="name"><input type="text" class="r-name"></td>' +
      '<td class="qty"><input type="text" class="r-qty" inputmode="numeric"></td>' +
      '<td class="price"><input type="text" class="r-price"></td>' +
      '<td class="jan"><input type="text" class="r-jan"></td>' +
      '<td class="due"><input type="text" class="r-due"></td>';
    tr.querySelector('.r-name').value = v.name || '';
    tr.querySelector('.r-qty').value = v.qty || '';
    tr.querySelector('.r-price').value = v.price || '';
    tr.querySelector('.r-jan').value = v.jan || '';
    tr.querySelector('.r-due').value = v.due || '';
    // 品名を入れた行は、希望納期が空なら「最短納期希望」を自動で入れる（自分で消した行はそのまま）
    var dueEl = tr.querySelector('.r-due');
    dueEl.addEventListener('input', function () { dueEl.dataset.touched = '1'; });
    tr.querySelector('.r-name').addEventListener('input', function () {
      if (this.value.trim() && !dueEl.value && !dueEl.dataset.touched) dueEl.value = DEFAULT_DUE;
    });
    rowsEl.appendChild(tr);
    renumber();
  }

  function renumber() {
    rowsEl.querySelectorAll('tr').forEach(function (tr, i) { tr.querySelector('.no').textContent = i + 1; });
  }

  function snapshot() {
    var rows = [];
    rowsEl.querySelectorAll('tr').forEach(function (tr) {
      rows.push({ name: tr.querySelector('.r-name').value, qty: tr.querySelector('.r-qty').value, price: tr.querySelector('.r-price').value, jan: tr.querySelector('.r-jan').value, due: tr.querySelector('.r-due').value });
    });
    return { id: currentId, to: document.getElementById('f-to').value, date: document.getElementById('f-date').value, author: document.getElementById('f-author').value, addr: document.getElementById('f-addr').value, company: document.getElementById('f-company').value, tel: document.getElementById('f-tel').value, note: document.getElementById('f-note').value, rows: rows };
  }

  function saveDraft() { if (/[?&]demo=1/.test(location.search)) return; try { localStorage.setItem(STORE_KEY, JSON.stringify(snapshot())); } catch (e) {} }

  function restore(d) {
    document.getElementById('f-to').value = d.to || '';
    document.getElementById('f-date').value = d.date || todayISO();
    document.getElementById('f-author').value = d.author || '石谷 豪';
    document.getElementById('f-addr').value = d.addr != null ? d.addr : DEF_ADDR;
    document.getElementById('f-company').value = d.company != null ? d.company : DEF_COMPANY;
    document.getElementById('f-tel').value = d.tel != null ? d.tel : DEF_TEL;
    syncSenderPick();
    document.getElementById('f-note').value = d.note || '';
    rowsEl.innerHTML = '';
    (d.rows && d.rows.length ? d.rows : []).forEach(addRow);
    while (rowsEl.children.length < 15) addRow();
    syncShipPick();
  }

  var draft = null;
  try { var rl = localStorage.getItem('po-reload'); if (rl) { localStorage.removeItem('po-reload'); draft = JSON.parse(rl); currentId = draft.id || null; } } catch (e) {}
  if (!draft) { try { draft = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); if (draft) draft.date = todayISO(); } catch (e) {} }
  var DEMO = /[?&]demo=1/.test(location.search);
  if (DEMO) {
    draft = {
      to: '株式会社ファイブコア', author: '石谷 豪',
      rows: [
        { name: 'ブランクス CK-662UL', qty: '5', price: '12,000', jan: '123456', due: '10/20' },
        { name: 'ブランクス CK-702L', qty: '3', price: '13,500', jan: '234567', due: '10/20' },
        { name: 'リールシート 16mm', qty: '10', price: '2,800', jan: '345678', due: '10/25' },
        { name: 'ガイドセット Fuji SiC', qty: '4', price: '5,400', jan: '456789', due: '10/25' },
        { name: 'グリップ EVA 150mm', qty: '8', price: '900', jan: '567890', due: '10/31' }
      ],
      note: '送り先①\n〒188-0004 東京都西東京市西原町5-3-30パルシオⅡ301\n株式会社IG 石谷 豪\n\n送り先②\n〒000-0000 ○○県○○市○○1-2-3\n○○ 様　TEL.000-0000-0000'
    };
  }
  restore(draft || {});
  document.getElementById('f-sender').addEventListener('change', function () {
    var v = SENDERS[this.value] || { addr: '', company: '', tel: '' };
    document.getElementById('f-addr').value = v.addr;
    document.getElementById('f-company').value = v.company;
    document.getElementById('f-tel').value = v.tel;
    document.body.classList.toggle('no-logo', this.value !== 'ig');
    fitAddr();
    if (this.value === 'custom') document.getElementById('f-addr').focus();
    if (!DEMO) saveDraft();
  });
  document.getElementById('f-ship').addEventListener('change', function () {
    setShip(this.value);
    if (!DEMO) saveDraft();
  });
  document.getElementById('f-note').addEventListener('input', syncShipPick);
  // 右上を直接書き換えたら、選択も「自由入力」などに合わせる
  ['f-addr', 'f-company', 'f-tel'].forEach(function (id) {
    document.getElementById(id).addEventListener('input', function () {
      syncSenderPick();
      if (document.getElementById('f-sender').value === 'blank') document.getElementById('f-sender').value = 'custom';
    });
  });
  if (!DEMO) document.addEventListener('input', saveDraft);

  document.getElementById('btn-add').addEventListener('click', function () { addRow(); saveDraft(); });
  document.getElementById('btn-print').addEventListener('click', function () { window.print(); });
  document.getElementById('btn-reset').addEventListener('click', function () {
    if (!confirm('入力内容をすべてクリアしますか？')) return;
    currentId = null;
    restore({});
    saveDraft();
  });

  function swapFields() {
    var swaps = [];
    document.querySelectorAll('.sheet input, .sheet textarea').forEach(function (el) {
      var text = el.value;
      if (el.type === 'date') { var p = el.value ? el.value.split('-') : null; text = p ? p[0] + '/' + Number(p[1]) + '/' + Number(p[2]) : ''; }
      var cs = getComputedStyle(el);
      var o = document.createElement('div');
      o.textContent = text;
      var inCell = !!el.closest('td');
      o.style.cssText = 'font-family:inherit;font-size:' + cs.fontSize + ';font-weight:' + cs.fontWeight + ';text-align:' + cs.textAlign + ';color:inherit;padding:' + cs.padding + ';line-height:' + (el.tagName === 'TEXTAREA' ? '1.7' : '1.4') + ';white-space:pre-wrap;width:100%;min-height:' + (inCell && el.closest('.items') ? '1.9em' : '0') + ';';
      var prev = el.style.display;
      el.style.display = 'none';
      el.insertAdjacentElement('afterend', o);
      swaps.push({ el: el, o: o, prev: prev });
    });
    return swaps;
  }

  async function saveToHistory() {
    var o = snapshot();
    if (!currentId) currentId = 'po-' + Date.now();
    o.id = currentId; o.__po = true;
    try {
      var res = await fetch(SYNC_API + '/paint');
      if (!res.ok) throw new Error('load failed');
      var all = await res.json();
      var others = all.filter(function (r) { return !r.__po; });
      var list = all.filter(function (r) { return r.__po; });
      var idx = list.findIndex(function (x) { return x.id === o.id; });
      if (idx >= 0) list[idx] = o; else list.push(o);
      var put = await fetch(SYNC_API + '/paint', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(others.concat(list)) });
      if (!put.ok) throw new Error('save failed');
      saveDraft();
    } catch (e) {
      console.error(e);
      alert('PDFは作成しましたが、注文書一覧への保存に失敗しました。');
    }
  }

  document.getElementById('btn-save').addEventListener('click', async function () {
    var btn = this, label = btn.textContent;
    btn.disabled = true; btn.textContent = '作成中…';
    var win = window.open('', '_blank');
    try { if (win) { win.document.write('<meta charset="utf-8"><meta name="viewport" content="width=device-width"><p style="font:16px sans-serif;padding:2rem">PDFを作成中です…数秒お待ちください</p>'); win.document.close(); } } catch (e) {}
    document.body.classList.add('pdf-capture');
    var swaps = swapFields();
    try {
      var sheet = document.getElementById('sheet');
      var canvas = await html2canvas(sheet, { scale: 2, backgroundColor: '#ffffff', windowWidth: 1000 });
      var pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
      var pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight(), margin = 8;
      var imgW = pageW - margin * 2, imgH = imgW * canvas.height / canvas.width;
      if (imgH > pageH - margin * 2) { imgH = pageH - margin * 2; imgW = imgH * canvas.width / canvas.height; }
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', margin, margin, imgW, imgH);
      var to = document.getElementById('f-to').value.trim() || '注文書';
      var d = document.getElementById('f-date').value.replace(/-/g, '');
      var name = d + to.replace(/[\\/:*?"<>|]/g, '') + '_注文書.pdf';
      if (win) { win.location.href = pdf.output('bloburl'); } else { pdf.save(name); }
      if (!DEMO) await saveToHistory();
    } catch (e) {
      console.error(e);
      try { if (win) win.document.body.innerHTML = '<p style="font:16px sans-serif;padding:2rem">PDFの作成に失敗しました。元の画面に戻ってもう一度お試しください。<br><small>' + String(e && e.message || e) + '</small></p>'; } catch (e2) {}
      alert('PDFの作成に失敗しました。もう一度お試しください。');
    } finally {
      swaps.forEach(function (s) { s.o.remove(); s.el.style.display = s.prev; });
      document.body.classList.remove('pdf-capture');
      btn.disabled = false; btn.textContent = label;
    }
  });
</script>
<script>
  (function () {
    try {
      var p = location.pathname + location.search, k = 'fresh:' + p;
      if (sessionStorage.getItem(k)) return;
      Promise.all([
        fetch(p, { cache: 'force-cache' }).then(function (r) { return r.text(); }),
        fetch(p + (p.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); })
      ]).then(function (t) {
        if (t[0] !== t[1]) {
          sessionStorage.setItem(k, '1');
          fetch(p, { cache: 'reload' }).then(function () { location.reload(); });
        }
      }).catch(function () {});
    } catch (e) {}
  })();
</script>
