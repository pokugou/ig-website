<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>ご注文ありがとうございます｜Formosa One</title>
<style>
:root{--red:#c8102e;--red-dark:#9e0b23;--gold:#f5b400;--jade:#0f8a6d;--text:#222;--sub:#666;--line:#e5e5e5;--bg:#f5f5f5;--white:#fff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;color:var(--text);background:var(--bg);font-size:14px;line-height:1.7}
a{color:inherit;text-decoration:none}
header{background:var(--white);border-bottom:1px solid var(--line)}
header .wrap{max-width:1200px;margin:0 auto;padding:0 16px;height:64px;display:flex;align-items:center}
.logo{display:flex;align-items:center;gap:8px}
.logo-mark{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:900;font-size:18px;font-family:Georgia,serif;position:relative}
.logo-mark::after{content:"";position:absolute;width:10px;height:10px;background:var(--gold);border-radius:50%;top:-2px;right:-2px;border:2px solid #fff}
.logo-text{font-weight:900;font-size:22px;letter-spacing:-.5px;color:var(--red);font-family:"Helvetica Neue",Arial,sans-serif}
.logo-text span{color:var(--text)}
main{max-width:640px;margin:40px auto;padding:0 16px}
.box{background:var(--white);border:1px solid var(--line);border-radius:6px;padding:40px 28px;text-align:center}
.check{width:64px;height:64px;border-radius:50%;background:#e8f6f1;color:var(--jade);display:grid;place-items:center;margin:0 auto 16px}
h1{font-size:22px;font-weight:900;margin-bottom:12px}
p{color:#444}
.steps{text-align:left;background:#fafafa;border-radius:6px;padding:16px 20px;margin:24px 0;font-size:13px}
.steps li{margin-left:1.2em;margin-bottom:6px}
.btn{display:inline-block;background:var(--red);color:#fff;font-weight:700;padding:12px 32px;border-radius:4px}
.btn:hover{background:var(--red-dark)}
small{display:block;margin-top:20px;color:var(--sub);font-size:12px}
</style>
</head>
<body>
<header><div class="wrap"><a href="./" class="logo" aria-label="Formosa One トップ"><div class="logo-mark">F</div><div class="logo-text">Formosa<span>One</span></div></a></div></header>
<main>
  <div class="box">
    <div class="check"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></div>
    <h1>ご注文ありがとうございます</h1>
    <p>お支払いが完了し、ご注文を承りました。</p>
    <ol class="steps">
      <li>ご登録のメールアドレスに「ご注文確認メール」をお送りしました。</li>
      <li>発送の準備が整いましたら、発送のご案内をお送りします。</li>
      <li>国内倉庫から最短翌日にお届けします。</li>
    </ol>
    <a href="./" class="btn">お買い物を続ける</a>
    <small>確認メールが届かない場合は、迷惑メールフォルダをご確認のうえ、お問い合わせください。</small>
  </div>
</main>
<script>
// the order is placed, so empty the cart
try { localStorage.removeItem("fo_cart"); } catch {}
</script>
</body>
</html>
