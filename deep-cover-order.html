<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ディープカバー用オーダーシート | IG Rod Planning</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink: #111; --sub: #555; --line: #999; --red: #cc2200; --bg: #f2f2f0; --paper: #fff; --label: #efefef; }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; padding: 1.6rem 1rem 4rem; }

  .toolbar { max-width: 794px; margin: 0 auto 0.8rem; display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
  .toolbar .back { margin-right: auto; font-size: 0.82rem; font-weight: 700; color: var(--sub); text-decoration: none; }
  .toolbar .back:hover { color: var(--red); }
  .toolbar .hist { font-size: 0.85rem; font-weight: 700; color: var(--ink); text-decoration: none; border: 1px solid var(--ink); padding: 0.6rem 1rem; background: #fff; }
  .toolbar .hist:hover { background: var(--red); border-color: var(--red); color: #fff; }
  .toolbar button { font-family: inherit; font-size: 0.85rem; font-weight: 700; padding: 0.6rem 1.2rem; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
  .toolbar button:hover { background: var(--red); border-color: var(--red); }
  .toolbar button.secondary { background: #fff; color: var(--ink); }
  .toolbar button.secondary:hover { background: #eee; color: var(--ink); border-color: var(--ink); }
  .editing-badge { display: none; max-width: 794px; margin: 0 auto 0.6rem; font-size: 0.76rem; font-weight: 700; color: var(--red); }
  .editing .editing-badge { display: block; }

  .sheets { display: flex; flex-direction: column; gap: 1.5rem; }
  .sheet-bar { display: flex; justify-content: flex-end; min-height: 0; }
  .sheet-remove { font-family: inherit; font-size: 0.68rem; color: var(--sub); background: none; border: 1px solid #ddd; padding: 0.2rem 0.55rem; cursor: pointer; }
  .sheet-remove:hover { color: var(--red); border-color: var(--red); }
  .add-sheet-bar { max-width: 794px; margin: 1rem auto 0; }
  .add-sheet-bar button { font-family: inherit; font-size: 0.85rem; font-weight: 700; padding: 0.7rem 1.6rem; border: 1px dashed var(--line); background: transparent; color: var(--sub); cursor: pointer; width: 100%; }
  .add-sheet-bar button:hover { border-color: var(--ink); color: var(--ink); border-style: solid; }
  .sheet { width: 794px; max-width: 100%; margin: 0 auto; background: var(--paper); border: 1px solid #ddd; padding: 1.6rem 2.2rem 1.6rem; }
  .sheet input, .sheet textarea { font-family: inherit; color: inherit; background: transparent; border: none; width: 100%; font-size: inherit; }
  .sheet input:focus, .sheet textarea:focus { outline: none; background: #fff8e0; }
  .sheet ::placeholder { color: #c4c4c4; font-weight: 400; }

  h1 { text-align: center; font-family: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif; font-size: 2.6rem; font-weight: 900; letter-spacing: -0.02em; transform: scaleX(0.82); line-height: 1.1; }
  .dateline { text-align: right; font-size: 0.9rem; margin: 0.2rem 0 0.35rem; display: flex; justify-content: flex-end; align-items: baseline; gap: 0.4rem; }
  .dateline input { width: auto; font-size: 0.9rem; }

  table.t { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.t td { border: 1px solid var(--ink); padding: 0; height: 2.75rem; vertical-align: middle; font-size: 0.95rem; }
  table.t td.lb { background: var(--label); padding: 0 0.35rem; font-size: 0.86rem; font-weight: 500; white-space: nowrap; }
  table.t td.lb small { font-size: 0.7rem; }
  table.t td input { padding: 0.35rem 0.4rem; font-weight: 700; font-size: 1.02rem; }
  table.t.main { border: 3px solid var(--ink); }
  table.t.main td { border-width: 1.5px; }
  .nb { display: inline-flex; align-items: center; justify-content: center; width: 1.15rem; height: 1.15rem; border-radius: 50%; background: var(--ink); color: #fff; font-size: 0.72rem; font-weight: 700; margin-right: 0.15rem; vertical-align: 1px; }
  .namecell { display: flex; align-items: center; }
  .namecell input { flex: 1; text-align: center; }
  .namecell .sama { padding: 0 0.5rem; border-left: 1.5px solid var(--ink); align-self: stretch; display: flex; align-items: center; background: #fff; font-size: 0.9rem; }

  .lame { padding: 0 !important; }
  .lame .opt { display: grid; grid-template-columns: 4rem 1fr; height: 1.4rem; }
  .lame .opt + .opt { border-top: 1px solid var(--ink); }
  .lame .opt > span { text-align: center; background: var(--label); font-size: 0.8rem; display: flex; align-items: center; justify-content: center; border-right: 1px solid var(--ink); }
  .lame .opt > b { text-align: center; font-weight: 400; font-size: 1.05rem; cursor: pointer; user-select: none; -webkit-user-select: none; display: flex; align-items: center; justify-content: center; min-height: 1.35rem; line-height: 1; }
  .lame .opt > b:hover { background: #fff8e0; }
  table.t td.lame { height: 2.85rem; }

  .guide { font-size: 0.9rem; line-height: 1.7; margin: 0.9rem 0 0.2rem; }
  .memo { border: 1px solid var(--ink); }
  .memo textarea { min-height: 6rem; padding: 0.6rem 0.7rem; font-size: 0.95rem; line-height: 1.7; resize: vertical; display: block; }

  table.p td { height: 2.3rem; }
  table.p td.num { width: 2.2rem; text-align: center; background: var(--label); font-size: 0.95rem; }
  table.p td.pr { width: 36%; }
  table.p td.pr input { text-align: center; font-weight: 500; }
  table.p td.ttl { text-align: center; background: var(--label); font-size: 0.95rem; }
  table.p td.big { text-align: center; font-weight: 900; font-size: 1.2rem; }
  table.p td.sec { background: var(--label); padding: 0 0.4rem; font-size: 0.92rem; }
  table.p td.val { text-align: center; font-size: 0.95rem; }
  table.p td.val.big { font-size: 1.2rem; font-weight: 900; }
  table.p td.name input { font-weight: 500; font-size: 1rem; }

  .notes { font-size: 0.78rem; line-height: 1.75; margin-top: 0.9rem; }
  .foot { text-align: center; margin-top: 0.8rem; font-size: 0.86rem; line-height: 1.7; }
  .foot b { font-weight: 700; }

  @media screen and (max-width: 680px) {
    body { padding: 1rem 0.5rem 3rem; }
    .sheet { padding: 1rem 0.6rem 1.2rem; }
    h1 { font-size: 2rem; }
    table.t td.lb { font-size: 0.74rem; padding: 0 0.2rem; }
    table.t td input { font-size: 0.9rem; padding: 0.3rem 0.25rem; }
    .lame .opt { grid-template-columns: 2.4rem 1fr; }
  }

  .pdf-capture .toolbar, .pdf-capture .editing-badge, .pdf-capture .add-sheet-bar { visibility: hidden; }
  .pdf-capture .sheet-bar { display: none; }
  .pdf-capture .sheets { gap: 0; }
  .pdf-capture .sheet { width: 794px; max-width: none; margin: 0; border: none; padding: 1.6rem 2.2rem 1.4rem; }
  .pdf-capture .lame .opt { grid-template-columns: 4rem 1fr; }
  .pdf-capture table.t td.lb { font-size: 0.86rem; padding: 0 0.35rem; }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar, .editing-badge, .add-sheet-bar, .sheet-bar { display: none !important; }
    .sheets { gap: 0; }
    .sheet + .sheet { page-break-before: always; }
    .sheet { width: 100%; border: none; padding: 0; }
    @page { size: A4; margin: 1cm; }
  }
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="pdf-download.js"></script>
<script>
  var SYNC_API = 'https://ig-sync.pokugou.workers.dev';
  var STORE_KEY = 'deep-cover-order-draft2';
  var TAG = '__dcorder';
  var TAX_RATE = 0.1;
  var sheetsEl = document.getElementById('sheets');
  var tpl = document.getElementById('sheet-tpl');

  function toHalf(s) { return String(s == null ? '' : s).replace(/[０-９．，－]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }).replace(/[ー−‐]/g, '-'); }
  function num(s) { var v = parseFloat(toHalf(s).replace(/[^0-9.-]/g, '')); return isNaN(v) ? 0 : v; }
  function yen(n) { return (n < 0 ? '-¥' : '¥') + Math.abs(Math.round(n)).toLocaleString('ja-JP'); }
  function money(s) { return String(s).trim() === '' ? '' : yen(num(s)); }
  function todayIso() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function jpDate(iso) { if (!iso) return ''; var p = iso.split('-'); return p[0] + '年 ' + Number(p[1]) + '月 ' + Number(p[2]) + '日'; }
  function sheets() { return Array.prototype.slice.call(sheetsEl.querySelectorAll('.sheet')); }
  function q(el, sel) { return el.querySelector(sel); }

  var TEXT_FIELDS = { customer: '.f-customer', freeLabel: '.f-free-label', freeValue: '.f-free-value', shop: '.f-shop', due: '.f-due', model: '.f-model', butt: '.f-butt', guideColor: '.f-guidecolor', body: '.f-body', g2: '.f-g2', g3: '.f-g3', g4: '.f-g4', g5: '.f-g5', g6: '.f-g6', g7: '.f-g7', memo: '.f-memo', base: '.f-base', date: '.f-date' };

  function totals(el) {
    var body = num(q(el, '.f-base').value);
    el.querySelectorAll('.o-price').forEach(function (e) { body += num(e.value); });
    var tax = Math.round(Math.round(body * TAX_RATE * 1e6) / 1e6);
    return { body: body, tax: tax, total: body + tax };
  }
  function recalc(el) {
    var t = totals(el);
    q(el, '.v-body').textContent = yen(t.body);
    q(el, '.v-tax').textContent = yen(t.tax);
    q(el, '.v-total').textContent = yen(t.total);
  }
  function paintLame(el) {
    q(el, '.lame-yes').textContent = el.dataset.lame === 'yes' ? '○' : '';
    q(el, '.lame-no').textContent = el.dataset.lame === 'no' ? '○' : '';
  }

  function collect(el) {
    var rec = { id: el.dataset.rid || null, savedAt: new Date().toISOString(), lame: el.dataset.lame || '', opts: [] };
    Object.keys(TEXT_FIELDS).forEach(function (k) { rec[k] = q(el, TEXT_FIELDS[k]).value; });
    var names = el.querySelectorAll('.o-name'), prices = el.querySelectorAll('.o-price');
    names.forEach(function (e, i) { rec.opts.push({ name: e.value, price: prices[i].value }); });
    var t = totals(el);
    rec.bodyPrice = t.body; rec.tax = t.tax; rec.total = t.total;
    rec[TAG] = true;
    return rec;
  }
  function hasContent(rec) {
    return Object.keys(TEXT_FIELDS).some(function (k) { return k !== 'date' && String(rec[k] || '').trim() !== ''; }) || rec.lame || rec.opts.some(function (o) { return o.name || o.price; });
  }

  function saveDraft() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify({ sheets: sheets().map(collect) })); } catch (e) {}
  }

  function updateControls() {
    var list = sheets();
    list.forEach(function (el) { q(el, '.sheet-remove').style.display = list.length > 1 ? '' : 'none'; });
    var editing = list.some(function (el) { return el.dataset.rid; });
    document.body.classList.toggle('editing', editing);
  }

  function populate(el, data, isCopy) {
    el.dataset.rid = isCopy ? '' : (data.id || '');
    Object.keys(TEXT_FIELDS).forEach(function (k) { if (data[k] != null) q(el, TEXT_FIELDS[k]).value = data[k]; });
    var names = el.querySelectorAll('.o-name'), prices = el.querySelectorAll('.o-price');
    (data.opts || []).forEach(function (o, i) { if (names[i]) { names[i].value = o.name || ''; prices[i].value = o.price || ''; } });
    el.dataset.lame = data.lame || '';
    paintLame(el); recalc(el);
  }

  function addSheet(data, isCopy) {
    var el = tpl.content.firstElementChild.cloneNode(true);
    sheetsEl.appendChild(el);
    q(el, '.f-date').value = todayIso();
    el.dataset.lame = '';
    el.querySelectorAll('.money').forEach(function (e) {
      e.addEventListener('input', function () { recalc(el); });
      e.addEventListener('blur', function () { this.value = money(this.value); recalc(el); });
    });
    q(el, '.lame-yes').addEventListener('click', function () { el.dataset.lame = el.dataset.lame === 'yes' ? '' : 'yes'; paintLame(el); saveDraft(); });
    q(el, '.lame-no').addEventListener('click', function () { el.dataset.lame = el.dataset.lame === 'no' ? '' : 'no'; paintLame(el); saveDraft(); });
    q(el, '.sheet-remove').addEventListener('click', function () {
      if (sheets().length <= 1) return;
      if (!confirm('このシートを削除しますか？（保存一覧の記録は消えません）')) return;
      el.remove(); updateControls(); saveDraft();
    });
    if (data) populate(el, data, isCopy);
    paintLame(el); recalc(el);
    updateControls();
    return el;
  }

  document.addEventListener('input', saveDraft);
  document.getElementById('btn-add-sheet').addEventListener('click', function () { var el = addSheet(); saveDraft(); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  document.getElementById('btn-add-bottom').addEventListener('click', function () { var el = addSheet(); saveDraft(); el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });

  document.getElementById('btn-reset').addEventListener('click', function () {
    if (!confirm('入力内容をすべてクリアしますか？（シートは1枚に戻ります）')) return;
    sheetsEl.innerHTML = ''; addSheet(); saveDraft();
  });
  document.getElementById('btn-print').addEventListener('click', function () { window.print(); });

  (function init() {
    var one = null, isCopy = false, draft = null;
    try {
      var raw = localStorage.getItem('dcorder-reload');
      if (raw) { localStorage.removeItem('dcorder-reload'); one = JSON.parse(raw); isCopy = !!one.__copy; }
    } catch (e) {}
    if (one) {
      if (isCopy) { delete one.id; one.date = todayIso(); one.due = ''; }
      addSheet(one, isCopy);
      return;
    }
    try { draft = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) {}
    if (draft && draft.sheets && draft.sheets.length) {
      draft.sheets.forEach(function (d) { d.date = todayIso(); addSheet(d, false); });
    } else {
      // carry over a draft saved by the earlier single-sheet version
      try { var old = JSON.parse(localStorage.getItem('deep-cover-order-draft') || 'null'); if (old) { old.date = todayIso(); addSheet(old, false); return; } } catch (e) {}
      addSheet();
    }
  })();

  async function saveToHistory(saveOnly) {
    var targets = sheets().map(function (el) { return { el: el, rec: collect(el) }; }).filter(function (x) { return hasContent(x.rec); });
    if (!targets.length) { if (saveOnly) alert('保存する内容がありません。'); return false; }
    try {
      var res = await fetch(SYNC_API + '/paint?_=' + Date.now());
      if (!res.ok) throw new Error('load failed');
      var all = await res.json();
      var stamp = Date.now();
      targets.forEach(function (x, i) {
        x.rec.id = x.el.dataset.rid || ('dc-' + stamp + '-' + i);
        var idx = all.findIndex(function (r) { return r[TAG] && r.id === x.rec.id; });
        if (idx >= 0) all[idx] = x.rec; else all.push(x.rec);
      });
      var put = await fetch(SYNC_API + '/paint', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(all) });
      if (!put.ok) throw new Error('save failed');
      targets.forEach(function (x) { x.el.dataset.rid = x.rec.id; });
      updateControls(); saveDraft();
      return true;
    } catch (e) {
      console.error(e);
      alert((saveOnly ? '' : 'PDFは作成しましたが、') + '保存一覧への保存に失敗しました。');
      return false;
    }
  }

  function swapFields() {
    var swaps = [];
    document.querySelectorAll('.sheet input[type="text"], .sheet input[type="date"], .sheet textarea').forEach(function (el) {
      var text = el.value;
      if (el.type === 'date') text = jpDate(el.value);
      if (el.classList.contains('money')) text = money(text);
      var cs = getComputedStyle(el);
      var o = document.createElement('div');
      o.textContent = text || ' ';
      var inline = !!el.closest('.dateline');
      o.style.cssText = 'font-family:inherit;font-size:' + cs.fontSize + ';font-weight:' + cs.fontWeight + ';color:' + cs.color + ';text-align:' + cs.textAlign + ';padding:' + cs.padding + ';line-height:' + (el.tagName === 'TEXTAREA' ? '1.7' : '1.35') + ';white-space:pre-wrap;word-break:break-word;' + (inline ? 'display:inline-block;width:auto;' : 'flex:1;width:100%;') + 'min-height:' + (el.tagName === 'TEXTAREA' ? cs.minHeight : '0') + ';';
      var prev = el.style.display;
      el.style.display = 'none';
      el.insertAdjacentElement('afterend', o);
      swaps.push({ el: el, o: o, prev: prev });
    });
    return swaps;
  }

  // Renders every sheet to a canvas (used by the saved list inside a hidden frame to build a combined PDF).
  async function captureSheetCanvases() {
    document.body.classList.add('pdf-capture');
    var swaps = swapFields();
    try {
      var out = [], els = sheets();
      for (var i = 0; i < els.length; i++) out.push(await html2canvas(els[i], { scale: 2, backgroundColor: '#ffffff', windowWidth: 1000 }));
      return out;
    } finally {
      swaps.forEach(function (s) { s.o.remove(); s.el.style.display = s.prev; });
      document.body.classList.remove('pdf-capture');
    }
  }
  window.captureSheetCanvases = captureSheetCanvases;

  wireSaveOnly(document.getElementById('btn-save-only'), function () { return saveToHistory(true); });

  document.getElementById('btn-save').addEventListener('click', async function () {
    var btn = this, label = btn.textContent;
    btn.disabled = true; btn.textContent = '作成中…';
    var win = window.open('', '_blank');
    try { if (win) { win.document.write('<meta charset="utf-8"><meta name="viewport" content="width=device-width"><p style="font:16px sans-serif;padding:2rem">PDFを作成中です…数秒お待ちください</p>'); win.document.close(); } } catch (e) {}
    document.body.classList.add('pdf-capture');
    var swaps = swapFields();
    var undone = false;
    function undo() { if (undone) return; undone = true; swaps.forEach(function (s) { s.o.remove(); s.el.style.display = s.prev; }); document.body.classList.remove('pdf-capture'); }
    try {
      var pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
      var pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight(), margin = 6;
      var els = sheets();
      for (var i = 0; i < els.length; i++) {
        var canvas = await html2canvas(els[i], { scale: 2, backgroundColor: '#ffffff', windowWidth: 1000 });
        var imgW = pageW - margin * 2, imgH = imgW * canvas.height / canvas.width;
        if (imgH > pageH - margin * 2) { imgH = pageH - margin * 2; imgW = imgH * canvas.width / canvas.height; }
        if (i > 0) pdf.addPage();
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', (pageW - imgW) / 2, margin, imgW, imgH);
      }
      var first = q(els[0], '.f-customer').value.trim().replace(/[\\/:*?"<>|]/g, '') || 'オーダーシート';
      var name = 'ディープカバー_' + (els.length > 1 ? first + '他' + els.length + '枚' : first) + '_' + q(els[0], '.f-date').value.replace(/-/g, '') + '.pdf';
      if (win) { win.location.href = pdf.output('bloburl'); } else { pdf.save(name); }
      if (window.showPdfDownload) showPdfDownload(pdf, name);
      undo();
      btn.textContent = '一覧に保存中…';
      await saveToHistory();
    } catch (e) {
      console.error(e);
      try { if (win) win.document.body.innerHTML = '<p style="font:16px sans-serif;padding:2rem">PDFの作成に失敗しました。元の画面に戻ってもう一度お試しください。<br><small>' + String(e && e.message || e) + '</small></p>'; } catch (e2) {}
      alert('PDFの作成に失敗しました。もう一度お試しください。');
    } finally {
      undo();
      btn.disabled = false; btn.textContent = label;
    }
  });
</script>
<script>
  (function () {
    try {
      var p = location.pathname + location.search, k = 'fresh:' + p;
      if (sessionStorage.getItem(k) || /[?&]embed=1/.test(location.search)) return;
      Promise.all([
        fetch(p, { cache: 'force-cache' }).then(function (r) { return r.text(); }),
        fetch(p + (p.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); })
      ]).then(function (t) {
        if (t[0] !== t[1]) {
          sessionStorage.setItem(k, '1');
          fetch(p, { cache: 'reload' }).then(function () { location.reload(); });
        }
      }).catch(function () {});
    } catch (e) {}
  })();
</script>
