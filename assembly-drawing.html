<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #111; --sub: #555; --line: #999; --line2: #ccc;
    --red: #cc2200; --bg: #f2f2f0; --paper: #ffffff;
  }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; padding: 2rem 1rem 4rem; }

  .top-links { max-width: 1100px; margin: 0 auto 0.6rem; display: flex; justify-content: flex-end; }
  .top-links a { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.85rem; font-weight: 700; color: var(--ink); text-decoration: none; padding: 0.55rem 1.1rem; border: 1px solid var(--ink); background: #fff; }
  .top-links a:hover { background: var(--red); border-color: var(--red); color: #fff; }

  .toolbar { max-width: 1100px; margin: 0 auto 0.5rem; display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .toolbar-right { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .toolbar button { font-family: inherit; font-size: 0.85rem; font-weight: 700; padding: 0.6rem 1.2rem; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; letter-spacing: 0.03em; }
  .toolbar button:hover { background: var(--red); border-color: var(--red); }
  .toolbar button.secondary { background: #fff; color: var(--ink); }
  .toolbar button.secondary:hover { background: #eee; border-color: var(--ink); color: var(--ink); }
  .toolbar-hint { max-width: 1100px; margin: 0 auto 1.2rem; font-size: 0.72rem; color: var(--sub); }

  .sheets { max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
  .sheet { background: var(--paper); border: 1px solid var(--line2); padding: 1.6rem 1.8rem 2rem; }

  .sheet-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .sheet-no { display: flex; align-items: baseline; gap: 0.3rem; font-size: 0.85rem; font-weight: 700; color: var(--red); }
  .sheet-no input { width: 4em; border: none; border-bottom: 1px solid var(--red); background: transparent; font-family: inherit; font-size: inherit; font-weight: inherit; color: inherit; padding: 0.05rem 0.2rem; }
  .sheet-no input:focus { outline: none; background: #fff8e0; }
  .sheet-head-right { display: flex; flex-direction: column; align-items: flex-end; gap: 0.5rem; }
  .sheet-head-right .brand { font-size: 0.75rem; font-weight: 700; color: var(--sub); letter-spacing: 0.04em; }
  .sheet-remove { font-family: inherit; font-size: 0.68rem; color: var(--sub); background: none; border: 1px solid var(--line2); padding: 0.2rem 0.55rem; cursor: pointer; }
  .sheet-remove:hover { color: var(--red); border-color: var(--red); }

  .sheet-title { text-align: center; font-size: 1.4rem; font-weight: 900; letter-spacing: 0.5em; margin: 0.2rem 0 1rem; border-bottom: 3px solid var(--ink); padding-bottom: 0.6rem; }

  .title-block { display: grid; grid-template-columns: 1fr 1.3fr; gap: 1rem; border: 1px solid var(--ink); padding: 0.6rem 0.8rem; margin-bottom: 1.2rem; align-items: center; }
  .title-left { display: flex; flex-direction: column; gap: 0.3rem; }
  .title-left input { border: none; border-bottom: 1px dotted var(--line2); font-family: inherit; background: transparent; padding: 0.15rem 0.1rem; }
  .title-left input:focus { outline: none; background: #fff8e0; }
  .title-left .f-brand { font-size: 1rem; font-weight: 900; width: 4em; }
  .title-left .f-series { font-size: 1.1rem; font-weight: 900; font-style: italic; }
  .title-left .f-model { font-size: 1.4rem; font-weight: 900; }
  .title-right textarea { width: 100%; border: 1px solid var(--line2); font-family: inherit; font-size: 0.7rem; color: var(--sub); resize: vertical; padding: 0.3rem 0.4rem; background: transparent; }
  .title-right textarea:focus { outline: none; background: #fff8e0; }

  .main-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 1.4rem; align-items: start; }

  .section { margin-bottom: 1.2rem; }
  .section-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; color: #fff; background: var(--ink); display: inline-block; padding: 0.25rem 0.7rem; margin-bottom: 0.6rem; }

  .row { display: grid; grid-template-columns: 12em 1fr; align-items: baseline; gap: 0.6rem; padding: 0.3rem 0; border-bottom: 1px dotted var(--line2); }
  .row label { font-size: 0.75rem; font-weight: 700; color: var(--sub); }
  .row input, .row textarea { width: 100%; border: none; font-family: inherit; font-size: 0.85rem; padding: 0.15rem 0.1rem; background: transparent; }
  .row input:focus, .row textarea:focus { outline: none; background: #fff8e0; }

  .rod-svg-wrap { border: 1px solid var(--line2); margin-top: 0.6rem; padding: 0.4rem; }
  .rod-svg { width: 100%; height: auto; display: block; }

  .notes-list { display: flex; flex-direction: column; gap: 0.35rem; }
  .note-row { display: flex; align-items: center; gap: 0.5rem; }
  .note-row input { flex: 1; border: none; border-bottom: 1px solid var(--line2); font-family: inherit; font-size: 0.82rem; padding: 0.2rem 0.1rem; background: transparent; }
  .note-row input:focus { outline: none; background: #fff8e0; }
  .note-del { border: none; background: none; color: var(--sub); cursor: pointer; font-size: 0.9rem; line-height: 1; padding: 0.1rem 0.3rem; }
  .note-del:hover { color: var(--red); }
  .add-note-btn, .add-part-btn { margin-top: 0.5rem; font-family: inherit; font-size: 0.75rem; font-weight: 700; padding: 0.4rem 0.8rem; border: 1px dashed var(--line); background: transparent; color: var(--sub); cursor: pointer; }
  .add-note-btn:hover, .add-part-btn:hover { border-color: var(--ink); color: var(--ink); border-style: solid; }

  .memo-box { border: 1px solid var(--line2); padding: 0.5rem 0.6rem; }
  .memo-box textarea { width: 100%; border: none; font-family: inherit; font-size: 0.82rem; resize: vertical; background: transparent; line-height: 1.5; }
  .memo-box textarea:focus { outline: none; }

  .header-info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; border: 1px solid var(--ink); padding: 0.5rem 0.6rem; margin-bottom: 1rem; }
  .meta-item label { display: block; font-size: 0.62rem; font-weight: 700; color: var(--sub); letter-spacing: 0.04em; margin-bottom: 0.15rem; }
  .meta-item input { width: 100%; border: none; border-bottom: 1px solid var(--line); font-family: inherit; font-size: 0.82rem; padding: 0.2rem 0.1rem; background: transparent; }
  .meta-item input:focus { outline: none; border-bottom: 1px solid var(--red); }

  .parts-table { border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); }
  .pt-row { display: grid; grid-template-columns: 2.4em 1.4fr 1.6fr 2.4em 1.6fr 1.6em; }
  .pt-row > div { border-right: 1px solid var(--line2); border-bottom: 1px solid var(--line2); display: flex; align-items: center; padding: 0.15rem 0.3rem; }
  .pt-head { font-size: 0.68rem; font-weight: 700; background: #fafafa; }
  .pt-row input { width: 100%; border: none; font-family: inherit; font-size: 0.78rem; padding: 0.1rem; background: transparent; }
  .pt-row input:focus { outline: none; background: #fff8e0; }
  .pt-num { color: var(--sub); font-size: 0.78rem; justify-content: center; }
  .pt-del { border: none; background: none; color: var(--sub); cursor: pointer; font-size: 0.85rem; justify-content: center; width: 100%; }
  .pt-del:hover { color: var(--red); }

  .remarks-box { margin: 0.8rem 0 1.2rem; }

  .summary-grid { border-top: 1px solid var(--ink); border-left: 1px solid var(--ink); }
  .sg-row { display: grid; grid-template-columns: 6em 1fr 6em 1fr; }
  .sg-row.full { grid-template-columns: 6em 1fr; }
  .sg-row > div { border-right: 1px solid var(--line2); border-bottom: 1px solid var(--line2); display: flex; align-items: center; }
  .sg-label { font-size: 0.7rem; font-weight: 700; background: #fafafa; padding: 0.25rem 0.4rem; }
  .sg-value input { width: 100%; border: none; font-family: inherit; font-size: 0.8rem; padding: 0.25rem 0.4rem; background: transparent; }
  .sg-value input:focus { outline: none; background: #fff8e0; }

  .add-sheet-bar { max-width: 1100px; margin: 0 auto 2rem; text-align: center; }
  .add-sheet-bar button { font-family: inherit; font-size: 0.85rem; font-weight: 700; padding: 0.7rem 1.6rem; border: 1px dashed var(--line); background: transparent; color: var(--sub); cursor: pointer; width: 100%; }
  .add-sheet-bar button:hover { border-color: var(--ink); color: var(--ink); border-style: solid; }

  @media screen and (max-width: 860px) {
    body { padding: 1rem 0.6rem 3rem; }
    .toolbar { flex-wrap: wrap; }
    .toolbar-right { flex: 1; }
    .toolbar button { flex: 1; padding: 0.6rem 0.8rem; font-size: 0.78rem; }
    .sheet { padding: 1.2rem 1rem 1.6rem; }
    .title-block { grid-template-columns: 1fr; }
    .main-grid { grid-template-columns: 1fr; }
    .header-info-grid { grid-template-columns: 1fr 1fr; }
    .pt-row { grid-template-columns: 2em 1fr 1fr 2em 1fr 1.4em; }
    .row { grid-template-columns: 8em 1fr; }
  }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar, .toolbar-hint, .add-sheet-bar, .top-links { display: none; }
    .sheets { max-width: 100%; gap: 0; }
    .sheet { border: none; padding: 0.4cm 0.6cm; }
    .sheet + .sheet { page-break-before: always; }
    .sheet-remove, .note-del, .pt-del, .add-note-btn, .add-part-btn { display: none; }
    .sg-value input, .meta-item input, .pt-row input, .row input, .row textarea, .note-row input, .title-left input, .title-right textarea, .memo-box textarea, .sheet-no input { background: transparent !important; }
    @page { size: A4 landscape; margin: 1cm; }
  }

  .pdf-capture .sheet-remove, .pdf-capture .note-del, .pdf-capture .pt-del, .pdf-capture .add-note-btn, .pdf-capture .add-part-btn { display: none; }
</style>

<script>
  var sheetsEl = document.getElementById('sheets');
  var template = document.querySelector('.sheet');

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function renderRodSvg(sheet) {
    var svg = sheet.querySelector('.rod-svg');
    var totalLen = parseFloat(sheet.querySelector('.f-total-len').value) || 0;
    var posRaw = sheet.querySelector('.f-guide-pos').value;
    var positions = posRaw.split(',').map(function(s){ return parseFloat(s.trim()); }).filter(function(n){ return !isNaN(n); });
    var W = 760, H = 110, padL = 20, padR = 20;
    var maxPos = Math.max(totalLen, positions.length ? Math.max.apply(null, positions) : 0, 1);
    var scale = (W - padL - padR) / maxPos;
    var html = '';
    html += '<line x1="' + padL + '" y1="35" x2="' + (padL + totalLen * scale) + '" y2="35" stroke="#111" stroke-width="2"/>';
    var rowY = [55, 72, 89];
    positions.forEach(function(p, i){
      var x = padL + p * scale;
      var row = i % rowY.length;
      html += '<line x1="' + x + '" y1="25" x2="' + x + '" y2="' + (rowY[row] - 8) + '" stroke="#cc2200" stroke-width="1.2"/>';
      html += '<text x="' + x + '" y="' + rowY[row] + '" font-size="9" text-anchor="middle" fill="#555">' + p + '</text>';
    });
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    svg.innerHTML = html;
  }

  function renumberParts(sheet) {
    sheet.querySelectorAll('.parts-table .pt-row:not(.pt-head)').forEach(function(row, i){
      row.querySelector('.pt-num').textContent = i + 1;
    });
  }

  function bindPartRow(row) {
    var del = row.querySelector('.pt-del');
    del.addEventListener('click', function(){
      var table = row.closest('.parts-table');
      row.remove();
      renumberParts(table.closest('.sheet'));
    });
  }

  function bindAddPart(sheet) {
    sheet.querySelector('.add-part-btn').addEventListener('click', function(){
      var table = sheet.querySelector('.parts-table');
      var rows = table.querySelectorAll('.pt-row:not(.pt-head)');
      var last = rows[rows.length - 1];
      var clone = last.cloneNode(true);
      clone.querySelectorAll('input').forEach(function(el){ el.value = ''; });
      bindPartRow(clone);
      table.appendChild(clone);
      renumberParts(sheet);
    });
  }

  function bindNoteRow(row) {
    row.querySelector('.note-del').addEventListener('click', function(){
      var list = row.closest('.notes-list');
      if (list.querySelectorAll('.note-row').length <= 1) { row.querySelector('input').value = ''; return; }
      row.remove();
    });
  }

  function bindAddNote(sheet) {
    sheet.querySelector('.add-note-btn').addEventListener('click', function(){
      var list = sheet.querySelector('.notes-list');
      var rows = list.querySelectorAll('.note-row');
      var clone = rows[rows.length - 1].cloneNode(true);
      clone.querySelector('input').value = '';
      bindNoteRow(clone);
      list.appendChild(clone);
    });
  }

  function bindDiagramInputs(sheet) {
    sheet.querySelector('.f-total-len').addEventListener('input', function(){ renderRodSvg(sheet); });
    sheet.querySelector('.f-guide-pos').addEventListener('input', function(){ renderRodSvg(sheet); });
  }

  function updateRemoveVisibility() {
    var sheets = document.querySelectorAll('.sheet');
    sheets.forEach(function(sheet){
      sheet.querySelector('.sheet-remove').style.display = sheets.length > 1 ? '' : 'none';
    });
  }

  function bindRemove(sheet) {
    sheet.querySelector('.sheet-remove').addEventListener('click', function(){
      if (document.querySelectorAll('.sheet').length <= 1) return;
      if (!confirm('このシートを削除しますか？')) return;
      sheet.remove();
      updateRemoveVisibility();
    });
  }

  function bindSheet(sheet) {
    bindRemove(sheet);
    sheet.querySelectorAll('.pt-row:not(.pt-head)').forEach(bindPartRow);
    bindAddPart(sheet);
    sheet.querySelectorAll('.note-row').forEach(bindNoteRow);
    bindAddNote(sheet);
    bindDiagramInputs(sheet);
    renderRodSvg(sheet);
  }

  function addSheet() {
    var clone = template.cloneNode(true);
    clone.querySelectorAll('input[type="text"], textarea').forEach(function(el){ el.value = ''; });
    clone.querySelectorAll('.f-brand').forEach(function(el){ el.value = 'Gz'; });
    clone.querySelectorAll('.f-total-len').forEach(function(el){ el.value = '1890'; });
    clone.querySelectorAll('.f-guide-pos').forEach(function(el){ el.value = ''; });
    clone.querySelectorAll('.sheet-no-input').forEach(function(el){ el.value = document.querySelectorAll('.sheet').length + 1; });
    sheetsEl.appendChild(clone);
    bindSheet(clone);
    updateRemoveVisibility();
    clone.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.querySelectorAll('.sheet').forEach(bindSheet);
  updateRemoveVisibility();

  document.getElementById('btn-add').addEventListener('click', addSheet);
  document.getElementById('btn-add-bottom').addEventListener('click', addSheet);

  document.getElementById('btn-print').addEventListener('click', function(){ window.print(); });

  document.getElementById('btn-reset').addEventListener('click', function(){
    if (!confirm('入力内容をすべてクリアしますか？')) return;
    document.querySelectorAll('.sheet input[type="text"], .sheet textarea').forEach(function(el){ el.value = ''; });
    document.querySelectorAll('.sheet').forEach(function(sheet){ renderRodSvg(sheet); });
  });

  document.getElementById('btn-save').addEventListener('click', async function(){
    var btn = this;
    var originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = '作成中…';
    document.body.classList.add('pdf-capture');
    try {
      var pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'landscape' });
      var pageW = pdf.internal.pageSize.getWidth();
      var pageH = pdf.internal.pageSize.getHeight();
      var margin = 8;
      var sheetEls = document.querySelectorAll('.sheet');
      for (var i = 0; i < sheetEls.length; i++) {
        var canvas = await html2canvas(sheetEls[i], { scale: 2, backgroundColor: '#ffffff' });
        var imgData = canvas.toDataURL('image/jpeg', 0.92);
        var imgW = pageW - margin * 2;
        var imgH = imgW * canvas.height / canvas.width;
        if (imgH > pageH - margin * 2) {
          imgH = pageH - margin * 2;
          imgW = imgH * canvas.width / canvas.height;
        }
        if (i > 0) pdf.addPage();
        pdf.addImage(imgData, 'JPEG', (pageW - imgW) / 2, margin, imgW, imgH);
      }
      pdf.save('組立図_' + todayISO().replace(/-/g, '') + '.pdf');
    } catch (e) {
      console.error(e);
      alert('PDFの作成に失敗しました。もう一度お試しください。');
    } finally {
      document.body.classList.remove('pdf-capture');
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  });
</script>

</body>
</html>
