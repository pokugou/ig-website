<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>受注シート（社内用）| IG Rod Planning</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #111; --sub: #555; --line: #999; --line2: #ccc;
    --red: #cc2200; --bg: #f2f2f0; --paper: #ffffff;
  }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; padding: 2rem 1rem 4rem; }

  .toolbar { max-width: 800px; margin: 0 auto 1rem; display: flex; justify-content: flex-end; gap: 0.6rem; }
  .toolbar button { font-family: inherit; font-size: 0.85rem; font-weight: 700; padding: 0.6rem 1.2rem; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; letter-spacing: 0.03em; }
  .toolbar button:hover { background: var(--red); border-color: var(--red); }
  .toolbar button.secondary { background: #fff; color: var(--ink); }
  .toolbar button.secondary:hover { background: #eee; border-color: var(--ink); color: var(--ink); }

  .sheet { max-width: 800px; margin: 0 auto; background: var(--paper); border: 1px solid var(--line2); padding: 2.2rem 2.5rem 2.6rem; }

  .sheet-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid var(--ink); padding-bottom: 0.8rem; margin-bottom: 1.4rem; }
  .sheet-head h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: 0.06em; }
  .sheet-head .brand { font-size: 0.75rem; font-weight: 700; color: var(--sub); letter-spacing: 0.04em; }

  .meta-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; margin-bottom: 1.4rem; }
  .meta-item label { display: block; font-size: 0.65rem; font-weight: 700; color: var(--sub); letter-spacing: 0.05em; margin-bottom: 0.25rem; }
  .meta-item input, .meta-item select { width: 100%; border: none; border-bottom: 1px solid var(--line); font-family: inherit; font-size: 0.85rem; padding: 0.25rem 0.1rem; background: transparent; }
  .meta-item input:focus, .meta-item select:focus { outline: none; border-bottom: 1px solid var(--red); }

  .section { margin-bottom: 1.3rem; }
  .section-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; color: #fff; background: var(--ink); display: inline-block; padding: 0.25rem 0.7rem; margin-bottom: 0.7rem; }

  .row { display: grid; grid-template-columns: 130px 1fr; align-items: baseline; gap: 0.6rem; padding: 0.35rem 0; border-bottom: 1px dotted var(--line2); }
  .row label { font-size: 0.78rem; font-weight: 700; color: var(--sub); }
  .row input, .row select, .row textarea { width: 100%; border: none; font-family: inherit; font-size: 0.85rem; padding: 0.15rem 0.1rem; background: transparent; }
  .row input:focus, .row select:focus, .row textarea:focus { outline: none; background: #fff8e0; }
  .row textarea { resize: vertical; min-height: 2.4em; line-height: 1.5; }

  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.5rem; }
  .cols2 .row { grid-template-columns: 132px 1fr; }

  .memo-box { border: 1px solid var(--line2); min-height: 3.4em; padding: 0.5rem 0.6rem; }
  .memo-box textarea { width: 100%; height: 100%; min-height: 3rem; border: none; font-family: inherit; font-size: 0.85rem; resize: vertical; background: transparent; }
  .memo-box textarea:focus { outline: none; }

  .hint { font-size: 0.68rem; color: var(--sub); margin-top: 0.2rem; }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .sheet { border: none; max-width: 100%; padding: 0.4cm 0.6cm; }
    .row input, .row select, .row textarea, .meta-item input, .meta-item select, .memo-box textarea { background: transparent !important; }
    .section-title { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: A4; margin: 1.2cm; }
  }
</style>
</head>
<body>

  <div class="toolbar">
    <button type="button" class="secondary" id="btn-reset">クリア</button>
    <button type="button" id="btn-print">この内容で印刷</button>
  </div>

  <div class="sheet">

    <div class="sheet-head">
      <h1>受注シート</h1>
      <div class="brand">IG Rod Planning ／ 社内共有用</div>
    </div>

    <div class="meta-grid">
      <div class="meta-item">
        <label>受注日</label>
        <input type="date" id="f-order-date">
      </div>
      <div class="meta-item">
        <label>受注番号</label>
        <input type="text" placeholder="例：20260905-01">
      </div>
      <div class="meta-item">
        <label>受付方法</label>
        <select id="f-source">
          <option value="Web">Webフォーム</option>
          <option value="電話">電話</option>
          <option value="来店">来店</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div class="meta-item">
        <label>受付担当</label>
        <select id="f-staff">
          <option>石谷豪</option>
        </select>
      </div>
    </div>

    <div class="section">
      <div class="section-title">お客様情報</div>
      <div class="cols2">
        <div>
          <div class="row"><label>お名前</label><input type="text"></div>
          <div class="row"><label>電話番号</label><input type="tel"></div>
        </div>
        <div>
          <div class="row"><label>発送方法</label>
            <select>
              <option value="">選択</option>
              <option>営業所止め（送料無料）</option>
              <option>個人宅宛（着払い）</option>
              <option>その他</option>
            </select>
          </div>
        </div>
      </div>
      <div class="row" style="grid-template-columns:130px 1fr;">
        <label>送り先住所</label>
        <textarea rows="2"></textarea>
      </div>
    </div>

    <div class="section">
      <div class="section-title">ベースモデル</div>
      <div class="row">
        <label>モデル選択</label>
        <select id="f-model">
          <option value="">選択してください</option>
          <optgroup label="── STRIX EDGE　イカメタル ──">
            <option>SE510ML-B（ベイト）</option>
            <option>SE66ML-B（ベイト）</option>
            <option>SE510ML-S（スピニング）</option>
            <option>SE66ML-S（スピニング）</option>
          </optgroup>
          <optgroup label="── STRIX EDGE　ティップランカスタム ──">
            <option>SE510ML-TR（スピニング）</option>
            <option>SE66ML-TR（スピニング）</option>
          </optgroup>
          <optgroup label="── GTLJ　ライトジギング ──">
            <option>GTLJ63ULB（ベイト）</option>
            <option>GTLJ63LB（ベイト）</option>
            <option>GTLJ63MB（ベイト）</option>
            <option>GTLJ63ULS（スピニング）</option>
            <option>GTLJ63LS（スピニング）</option>
            <option>GTLJ63MS（スピニング）</option>
          </optgroup>
          <optgroup label="── GTSLJ　超万能ライトオフショアロッド ──">
            <option>GTSLJ62UL-B（ベイト）</option>
            <option>GTSLJ63L-B（ベイト）</option>
            <option>GTSLJ62UL-S（スピニング）</option>
            <option>GTSLJ63L-S（スピニング）</option>
          </optgroup>
          <optgroup label="── GTS　スロージギング ──">
            <option>GTS632（ベイト）</option>
            <option>GTS5102（ベイト）</option>
            <option>GTS633（ベイト）</option>
            <option>GTS5103（ベイト）</option>
            <option>GTS634（ベイト）</option>
            <option>GTS5104（ベイト）</option>
          </optgroup>
          <optgroup label="── GTJ　ジギング ──">
            <option>GTJ62MLS（スピニング）</option>
            <option>GTJ62MS（スピニング）</option>
            <option>GTJ62MHS（スピニング）</option>
            <option>GTLJ63ULS（ベイト）</option>
            <option>GTLJ63LS（ベイト）</option>
            <option>GTLJ63MS（ベイト）</option>
          </optgroup>
        </select>
      </div>
    </div>

    <div class="section">
      <div class="section-title">カラーカスタム</div>
      <div class="cols2">
        <div>
          <div class="row"><label>ブランクスカラー</label><input type="text" placeholder="番号・カラー名"></div>
          <div class="row"><label>ティップカラー</label><input type="text" placeholder="番号・カラー名"></div>
          <div class="row"><label>リールシート</label><input type="text" placeholder="番号・カラー名（塗装時のみ）"></div>
        </div>
        <div>
          <div class="row"><label>メインスレッド</label><input type="text"></div>
          <div class="row"><label>ティップ部分スレッド</label><input type="text"></div>
          <div class="row"><label>ピンライン</label><input type="text"></div>
        </div>
      </div>
      <p class="hint">※ カラー番号は color.html のカラーチャートに準拠</p>
    </div>

    <div class="section">
      <div class="section-title">カスタムオプション</div>
      <div class="cols2">
        <div>
          <div class="row"><label>ガイド仕様</label><input type="text"></div>
          <div class="row"><label>グリップ仕様</label><input type="text"></div>
        </div>
        <div>
          <div class="row"><label>ネーム仕様</label>
            <select id="f-name">
              <option>定番ネームのみ</option>
              <option>オリジナルネーム</option>
            </select>
          </div>
          <div class="row"><label>ネーム内容</label><input type="text" placeholder="オリジナル時のみ記入"></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">こだわり・備考</div>
      <div class="memo-box"><textarea rows="2" placeholder="カラーコーディネートの希望、特記事項など"></textarea></div>
    </div>

  </div>

<script>
  (function setToday(){
    var d = new Date();
    var iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    document.getElementById('f-order-date').value = iso;
  })();

  document.getElementById('btn-print').addEventListener('click', function(){ window.print(); });

  document.getElementById('btn-reset').addEventListener('click', function(){
    if (!confirm('入力内容をすべてクリアしますか？')) return;
    document.querySelectorAll('.sheet input[type="text"], .sheet input[type="tel"], .sheet input[type="email"], .sheet textarea').forEach(function(el){ el.value = ''; });
    document.querySelectorAll('.sheet select').forEach(function(el){ el.selectedIndex = 0; });
    document.querySelectorAll('.sheet input[type="checkbox"]').forEach(function(el){ el.checked = false; });
  });
</script>

</body>
</html>
