<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>受注シート（社内用）| IG Rod Planning</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --ink: #111; --sub: #555; --line: #999; --line2: #ccc;
    --red: #cc2200; --bg: #f2f2f0; --paper: #ffffff;
  }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; padding: 2rem 1rem 4rem; }

  .toolbar { max-width: 800px; margin: 0 auto 1rem; display: flex; justify-content: flex-end; gap: 0.6rem; }
  .toolbar button { font-family: inherit; font-size: 0.85rem; font-weight: 700; padding: 0.6rem 1.2rem; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; letter-spacing: 0.03em; }
  .toolbar button:hover { background: var(--red); border-color: var(--red); }
  .toolbar button.secondary { background: #fff; color: var(--ink); }
  .toolbar button.secondary:hover { background: #eee; border-color: var(--ink); color: var(--ink); }

  .sheet { max-width: 800px; margin: 0 auto; background: var(--paper); border: 1px solid var(--line2); padding: 2.2rem 2.5rem 2.6rem; }

  .sheet-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 3px solid var(--ink); padding-bottom: 0.8rem; margin-bottom: 1.4rem; }
  .sheet-head h1 { font-size: 1.5rem; font-weight: 900; letter-spacing: 0.06em; }
  .sheet-head .brand { font-size: 0.75rem; font-weight: 700; color: var(--sub); letter-spacing: 0.04em; }

  .meta-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; margin-bottom: 1.4rem; }
  .meta-item label { display: block; font-size: 0.65rem; font-weight: 700; color: var(--sub); letter-spacing: 0.05em; margin-bottom: 0.25rem; }
  .meta-item input, .meta-item select { width: 100%; border: none; border-bottom: 1px solid var(--line); font-family: inherit; font-size: 0.85rem; padding: 0.25rem 0.1rem; background: transparent; }
  .meta-item input:focus, .meta-item select:focus { outline: none; border-bottom: 1px solid var(--red); }

  .section { margin-bottom: 1.3rem; }
  .section-title { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; color: #fff; background: var(--ink); display: inline-block; padding: 0.25rem 0.7rem; margin-bottom: 0.7rem; }

  .row { display: grid; grid-template-columns: 130px 1fr; align-items: baseline; gap: 0.6rem; padding: 0.35rem 0; border-bottom: 1px dotted var(--line2); }
  .row label { font-size: 0.78rem; font-weight: 700; color: var(--sub); }
  .row input, .row select, .row textarea { width: 100%; border: none; font-family: inherit; font-size: 0.85rem; padding: 0.15rem 0.1rem; background: transparent; }
  .row input:focus, .row select:focus, .row textarea:focus { outline: none; background: #fff8e0; }
  .row textarea { resize: vertical; min-height: 2.4em; line-height: 1.5; }

  .cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 1.5rem; }
  .cols2 .row { grid-template-columns: 100px 1fr; }

  .price-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 0.3rem; }
  .price-table th, .price-table td { border-bottom: 1px dotted var(--line2); padding: 0.4rem 0.3rem; text-align: left; }
  .price-table th { font-size: 0.68rem; color: var(--sub); font-weight: 700; }
  .price-table td.amt { text-align: right; white-space: nowrap; width: 110px; }
  .price-table input.amt-input { width: 100%; text-align: right; border: none; font-family: inherit; font-size: 0.85rem; background: transparent; }
  .price-table input.amt-input:focus { outline: none; background: #fff8e0; }
  .price-total-row td { border-bottom: none; border-top: 2px solid var(--ink); font-weight: 900; font-size: 1rem; padding-top: 0.6rem; }

  .memo-box { border: 1px solid var(--line2); min-height: 3.4em; padding: 0.5rem 0.6rem; }
  .memo-box textarea { width: 100%; height: 100%; min-height: 3rem; border: none; font-family: inherit; font-size: 0.85rem; resize: vertical; background: transparent; }
  .memo-box textarea:focus { outline: none; }

  .status-row { display: flex; gap: 1.6rem; flex-wrap: wrap; font-size: 0.85rem; }
  .status-row label { display: flex; align-items: center; gap: 0.4rem; font-weight: 700; }
  .status-row input[type="checkbox"] { width: 16px; height: 16px; }

  .sign-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-top: 1.2rem; }
  .sign-box { border: 1px solid var(--line2); padding: 0.6rem 0.8rem; }
  .sign-box label { display: block; font-size: 0.65rem; font-weight: 700; color: var(--sub); margin-bottom: 0.6rem; }
  .sign-box .sign-line { border-bottom: 1px solid var(--line); height: 1.6rem; }

  .hint { font-size: 0.68rem; color: var(--sub); margin-top: 0.2rem; }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar { display: none; }
    .sheet { border: none; max-width: 100%; padding: 0.4cm 0.6cm; }
    .row input, .row select, .row textarea, .meta-item input, .meta-item select, .price-table input.amt-input, .memo-box textarea { background: transparent !important; }
    .section-title { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: A4; margin: 1.2cm; }
  }
</style>
</head>
<body>

  <div class="toolbar">
    <button type="button" class="secondary" id="btn-reset">クリア</button>
    <button type="button" id="btn-print">この内容で印刷</button>
  </div>

  <div class="sheet">

    <div class="sheet-head">
      <h1>受注シート</h1>
      <div class="brand">IG Rod Planning ／ 社内共有用</div>
    </div>

    <div class="meta-grid">
      <div class="meta-item">
        <label>受注日</label>
        <input type="date" id="f-order-date">
      </div>
      <div class="meta-item">
        <label>受注番号</label>
        <input type="text" placeholder="例：20260905-01">
      </div>
      <div class="meta-item">
        <label>受付方法</label>
        <select id="f-source">
          <option value="Web">Webフォーム</option>
          <option value="電話">電話</option>
          <option value="来店">来店</option>
          <option value="その他">その他</option>
        </select>
      </div>
      <div class="meta-item">
        <label>受付担当</label>
        <input type="text" placeholder="担当者名">
      </div>
    </div>

    <div class="section">
      <div class="section-title">お客様情報</div>
      <div class="cols2">
        <div>
          <div class="row"><label>お名前</label><input type="text"></div>
          <div class="row"><label>電話番号</label><input type="tel"></div>
          <div class="row"><label>メール</label><input type="email"></div>
        </div>
        <div>
          <div class="row"><label>送料区分</label>
            <select>
              <option value="">選択</option>
              <option>営業所止め（送料無料）</option>
              <option>個人宅宛（着払い）</option>
            </select>
          </div>
          <div class="row"><label>支払方法</label>
            <select>
              <option value="">選択</option>
              <option>銀行振込</option>
              <option>PayPay</option>
              <option>カード決済</option>
            </select>
          </div>
        </div>
      </div>
      <div class="row" style="grid-template-columns:130px 1fr;">
        <label>送り先住所</label>
        <textarea rows="2"></textarea>
      </div>
    </div>

    <div class="section">
      <div class="section-title">ベースモデル</div>
      <div class="row">
        <label>モデル選択</label>
        <select id="f-model">
          <option value="" data-price="0">選択してください</option>
          <optgroup label="── STRIX EDGE　イカメタル ──">
            <option data-price="39300">SE510ML-B（ベイト）　¥39,300</option>
            <option data-price="39600">SE66ML-B（ベイト）　¥39,600</option>
            <option data-price="39300">SE510ML-S（スピニング）　¥39,300</option>
            <option data-price="39600">SE66ML-S（スピニング）　¥39,600</option>
          </optgroup>
          <optgroup label="── STRIX EDGE　ティップランカスタム ──">
            <option data-price="41200">SE510ML-TR（スピニング）　¥41,200</option>
            <option data-price="41500">SE66ML-TR（スピニング）　¥41,500</option>
          </optgroup>
          <optgroup label="── GTLJ　ライトジギング ──">
            <option data-price="32800">GTLJ63ULB（ベイト）　¥32,800</option>
            <option data-price="33200">GTLJ63LB（ベイト）　¥33,200</option>
            <option data-price="34500">GTLJ63MB（ベイト）　¥34,500</option>
            <option data-price="32800">GTLJ63ULS（スピニング）　¥32,800</option>
            <option data-price="33200">GTLJ63LS（スピニング）　¥33,200</option>
            <option data-price="34500">GTLJ63MS（スピニング）　¥34,500</option>
          </optgroup>
          <optgroup label="── GTSLJ　超万能ライトオフショアロッド ──">
            <option data-price="29800">GTSLJ62UL-B（ベイト）　¥29,800</option>
            <option data-price="29800">GTSLJ63L-B（ベイト）　¥29,800</option>
            <option data-price="29800">GTSLJ62UL-S（スピニング）　¥29,800</option>
            <option data-price="29800">GTSLJ63L-S（スピニング）　¥29,800</option>
          </optgroup>
          <optgroup label="── GTS　スロージギング ──">
            <option data-price="35600">GTS632（ベイト）　¥35,600</option>
            <option data-price="35300">GTS5102（ベイト）　¥35,300</option>
            <option data-price="36300">GTS633（ベイト）　¥36,300</option>
            <option data-price="36000">GTS5103（ベイト）　¥36,000</option>
            <option data-price="36800">GTS634（ベイト）　¥36,800</option>
            <option data-price="33000">GTS5104（ベイト）　¥33,000</option>
          </optgroup>
          <optgroup label="── GTJ　ジギング ──">
            <option data-price="33800">GTJ62MLS（スピニング）　¥33,800</option>
            <option data-price="34800">GTJ62MS（スピニング）　¥34,800</option>
            <option data-price="35800">GTJ62MHS（スピニング）　¥35,800</option>
            <option data-price="33800">GTLJ63ULS（ベイト）　¥33,800</option>
            <option data-price="34800">GTLJ63LS（ベイト）　¥34,800</option>
            <option data-price="35800">GTLJ63MS（ベイト）　¥35,800</option>
          </optgroup>
        </select>
      </div>
    </div>

    <div class="section">
      <div class="section-title">カラーカスタム</div>
      <div class="cols2">
        <div>
          <div class="row"><label>ブランクスカラー</label><input type="text" placeholder="番号・カラー名"></div>
          <div class="row"><label>ティップカラー</label><input type="text" placeholder="番号・カラー名"></div>
          <div class="row"><label>リールシート</label><input type="text" placeholder="番号・カラー名（塗装時のみ）"></div>
        </div>
        <div>
          <div class="row"><label>メインスレッド</label><input type="text"></div>
          <div class="row"><label>ティップ部分</label><input type="text"></div>
          <div class="row"><label>ピンライン</label><input type="text"></div>
        </div>
      </div>
      <p class="hint">※ カラー番号は color.html のカラーチャートに準拠</p>
    </div>

    <div class="section">
      <div class="section-title">カスタムオプション</div>
      <div class="cols2">
        <div>
          <div class="row"><label>ガイド仕様</label>
            <select id="f-guide">
              <option data-price="0">ストレート（＋¥0）</option>
              <option data-price="0">右スパイラル（＋¥0）</option>
              <option data-price="0">左スパイラル（＋¥0）</option>
              <option data-price="6000">トルザイトガイド（＋¥6,000）</option>
            </select>
          </div>
          <div class="row"><label>グリップ仕様</label>
            <select id="f-grip">
              <option data-price="0">EVA（＋¥0）</option>
              <option data-price="3800">コルクグリップ（＋¥3,800）</option>
              <option data-price="6000">リールシート塗装（＋¥6,000）</option>
            </select>
          </div>
        </div>
        <div>
          <div class="row"><label>ネーム仕様</label>
            <select id="f-name">
              <option data-price="0">定番ネームのみ（＋¥0）</option>
              <option data-price="1200">オリジナルネーム（＋¥1,200）</option>
            </select>
          </div>
          <div class="row"><label>ネーム内容</label><input type="text" placeholder="オリジナル時のみ記入"></div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title">こだわり・備考</div>
      <div class="memo-box"><textarea rows="2" placeholder="カラーコーディネートの希望、特記事項など"></textarea></div>
    </div>

    <div class="section">
      <div class="section-title">金額</div>
      <table class="price-table">
        <tr><th>項目</th><th style="text-align:right; width:110px;">金額</th></tr>
        <tr><td>ベースモデル</td><td class="amt" id="p-model">¥0</td></tr>
        <tr><td>ガイドオプション</td><td class="amt" id="p-guide">¥0</td></tr>
        <tr><td>グリップオプション</td><td class="amt" id="p-grip">¥0</td></tr>
        <tr><td>ネームオプション</td><td class="amt" id="p-name">¥0</td></tr>
        <tr><td>カラーオプション（手入力）</td><td class="amt"><input type="text" class="amt-input" id="p-color" placeholder="0" inputmode="numeric"></td></tr>
        <tr class="price-total-row"><td>合計</td><td class="amt" id="p-total">¥0</td></tr>
      </table>
    </div>

    <div class="section">
      <div class="section-title">社内ステータス</div>
      <div class="status-row">
        <label><input type="checkbox"> 入金確認済み</label>
        <label><input type="checkbox"> 発注書送付済み</label>
        <label><input type="checkbox"> 製作着手</label>
        <label><input type="checkbox"> 発送完了</label>
      </div>
    </div>

    <div class="sign-grid">
      <div class="sign-box"><label>受付確認</label><div class="sign-line"></div></div>
      <div class="sign-box"><label>共有先確認</label><div class="sign-line"></div></div>
    </div>

  </div>

<script>
  function yen(n) { return '¥' + Math.round(n).toLocaleString('ja-JP'); }

  function selPrice(sel) {
    var opt = sel.options[sel.selectedIndex];
    return opt ? (parseFloat(opt.getAttribute('data-price')) || 0) : 0;
  }

  function recalc() {
    var pModel = selPrice(document.getElementById('f-model'));
    var pGuide = selPrice(document.getElementById('f-guide'));
    var pGrip  = selPrice(document.getElementById('f-grip'));
    var pName  = selPrice(document.getElementById('f-name'));
    var pColor = parseFloat((document.getElementById('p-color').value || '0').replace(/[^0-9.-]/g, '')) || 0;

    document.getElementById('p-model').textContent = yen(pModel);
    document.getElementById('p-guide').textContent = yen(pGuide);
    document.getElementById('p-grip').textContent  = yen(pGrip);
    document.getElementById('p-name').textContent  = yen(pName);
    document.getElementById('p-total').textContent = yen(pModel + pGuide + pGrip + pName + pColor);
  }

  ['f-model','f-guide','f-grip','f-name'].forEach(function(id){
    document.getElementById(id).addEventListener('change', recalc);
  });
  document.getElementById('p-color').addEventListener('input', recalc);

  (function setToday(){
    var d = new Date();
    var iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    document.getElementById('f-order-date').value = iso;
  })();

  document.getElementById('btn-print').addEventListener('click', function(){ window.print(); });

  document.getElementById('btn-reset').addEventListener('click', function(){
    if (!confirm('入力内容をすべてクリアしますか？')) return;
    document.querySelectorAll('.sheet input[type="text"], .sheet input[type="tel"], .sheet input[type="email"], .sheet textarea').forEach(function(el){ el.value = ''; });
    document.querySelectorAll('.sheet select').forEach(function(el){ el.selectedIndex = 0; });
    document.querySelectorAll('.sheet input[type="checkbox"]').forEach(function(el){ el.checked = false; });
    recalc();
  });

  recalc();
</script>

</body>
</html>
