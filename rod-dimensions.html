<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ロッド仕様書 | IG Rod Planning</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink: #111; --sub: #555; --line: #999; --red: #cc2200; --bg: #f2f2f0; --paper: #fff; }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; padding: 1.6rem 1rem 4rem; }

  .toolbar { max-width: 794px; margin: 0 auto 0.8rem; display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
  .toolbar .back { margin-right: auto; font-size: 0.82rem; font-weight: 700; color: var(--sub); text-decoration: none; }
  .toolbar .back:hover { color: var(--red); }
  .toolbar button { font-family: inherit; font-size: 0.85rem; font-weight: 700; padding: 0.6rem 1.2rem; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
  .toolbar button:hover { background: var(--red); border-color: var(--red); }
  .toolbar button.secondary { background: #fff; color: var(--ink); }
  .toolbar button.secondary:hover { background: #eee; color: var(--ink); border-color: var(--ink); }
  .hint { max-width: 794px; margin: 0 auto 1rem; font-size: 0.72rem; color: var(--sub); }

  .sheet { width: 794px; max-width: 100%; margin: 0 auto; background: var(--paper); border: 1px solid #ddd; padding: 2rem 2.4rem 2.4rem; }
  .sheet input { font-family: inherit; color: inherit; background: transparent; border: none; width: 100%; }
  .sheet input:focus { outline: none; background: #fff8e0; }

  h1 { text-align: center; font-size: 1.6rem; font-weight: 900; letter-spacing: 0.4em; border-bottom: 3px solid var(--ink); padding-bottom: 0.6rem; margin-bottom: 1.2rem; }

  table.meta { width: 100%; border-collapse: collapse; margin-bottom: 1.2rem; }
  table.meta td { border: 1.5px solid var(--ink); padding: 0; font-size: 0.9rem; }
  table.meta td.k { width: 7.2rem; white-space: nowrap; text-align: center; font-size: 0.75rem; font-weight: 700; background: #f3f3f0; padding: 0.3rem 0.2rem; }
  table.meta td input { padding: 0.4rem 0.6rem; font-size: 1rem; font-weight: 700; }

  table.guides { width: 100%; border-collapse: collapse; }
  table.guides th, table.guides td { border: 1.5px solid var(--ink); padding: 0; }
  table.guides th { background: var(--ink); color: #fff; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em; padding: 0.45rem 0.3rem; }
  table.guides td.no { width: 4rem; text-align: center; font-weight: 700; font-size: 0.9rem; background: #f3f3f0; }
  table.guides td.pos { width: 11rem; }
  table.guides td.reel-label { font-size: 0.68rem; line-height: 1.25; padding: 0.3rem 0; }
  table.guides tbody#reel tr td { border-top: 3px double var(--ink); }
  table.guides tbody#reel tr td.del { border-top: none; }
  table.guides td input { padding: 0.55rem 0.7rem; font-size: 1.1rem; }
  table.guides td.pos input { text-align: right; font-weight: 900; font-size: 1.2rem; padding-right: 3rem; }
  table.guides td.pos { position: relative; }
  table.guides td.pos .unit { position: absolute; right: 0.7rem; top: 50%; transform: translateY(-50%); font-size: 0.8rem; color: var(--sub); }
  table.guides td.del { width: 2.2rem; border: none; text-align: center; background: transparent; }
  table.guides td.del button { border: none; background: none; color: var(--sub); font-size: 1rem; cursor: pointer; padding: 0.2rem 0.4rem; }
  table.guides td.del button:hover { color: var(--red); }
  .note { font-size: 0.72rem; color: var(--sub); margin-top: 0.5rem; }

  .add-row { max-width: 794px; margin: 0.6rem auto 0; }
  .add-row button { font-family: inherit; font-size: 0.8rem; font-weight: 700; padding: 0.55rem 1rem; width: 100%; border: 1px dashed var(--line); background: transparent; color: var(--sub); cursor: pointer; }
  .add-row button:hover { border-color: var(--ink); color: var(--ink); border-style: solid; }

  @media screen and (max-width: 640px) {
    .sheet { padding: 1.2rem 0.8rem 1.6rem; }
    table.guides td input { padding: 0.55rem 0.4rem; font-size: 1rem; }
    table.guides td.pos { width: 8.5rem; }
  }

  .pdf-capture .sheet { width: 794px; max-width: none; border: none; }
  .pdf-capture .toolbar, .pdf-capture .add-row, .pdf-capture .hint, .pdf-capture td.del, .pdf-capture th.del { display: none; }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar, .add-row, .hint, td.del, th.del { display: none; }
    .sheet { width: 100%; border: none; padding: 0; }
    @page { size: A4; margin: 1.2cm; }
  }
</style>
</head>
<body>

  <div class="toolbar">
    <a class="back" href="tools.html">← ツール一覧</a>
    <button type="button" class="secondary" id="btn-reset">クリア</button>
    <button type="button" class="secondary" id="btn-print">印刷</button>
    <button type="button" id="btn-save">PDFとして保存</button>
  </div>
  <p class="hint">ガイドパターンごとに、穂先（トップガイド）からの位置を入力します。入力した内容はこの端末に自動保存されます。</p>

  <div class="sheet" id="sheet">
    <h1>ロッド仕様書</h1>

    <table class="meta">
      <tr>
        <td class="k">製品名／モデル</td><td colspan="3"><input type="text" id="f-model" placeholder="例）GTJ623S"></td>
      </tr>
      <tr>
        <td class="k">作成日</td><td><input type="date" id="f-date"></td>
        <td class="k">作成者</td><td><input type="text" id="f-author" value="石谷 豪"></td>
      </tr>
    </table>

    <table class="guides">
      <thead><tr><th>No.</th><th>ガイドパターン</th><th>ガイド位置（穂先から）</th><th class="del"></th></tr></thead>
      <tbody id="rows"></tbody>
      <tbody id="reel"><tr class="reel-row">
        <td class="no reel-label">リール<br>シート</td>
        <td class="name"><input type="text" id="f-reel" placeholder="例）ワンピース／富士 VSS16"></td>
        <td class="pos"><input type="text" id="f-reel-pos" inputmode="decimal"><span class="unit">mm</span></td>
        <td class="del"></td>
      </tr></tbody>
    </table>
    <p class="note">位置はトップガイドを0mmとした、各ガイド位置までの距離（mm）です。</p>
  </div>

  <div class="add-row"><button type="button" id="btn-add">＋ 行を追加</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
  var rowsEl = document.getElementById('rows');
  var STORE_KEY = 'rod-dimensions-draft';
  var DEFAULT_ROWS = 10;

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

    function addRow(v) {
    v = v || {};
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td class="no"></td>' +
      '<td class="name"><input type="text" class="r-name" placeholder="例）SiC 4.5 ダブルフット"></td>' +
      '<td class="pos"><input type="text" class="r-pos" inputmode="decimal"><span class="unit">mm</span></td>' +
      '<td class="del"><button type="button" title="この行を削除">×</button></td>';
    tr.querySelector('.r-name').value = v.name || '';
    tr.querySelector('.r-pos').value = v.pos || '';
    tr.querySelector('.del button').addEventListener('click', function () {
      if (rowsEl.children.length <= 1) return;
      tr.remove(); renumber(); saveDraft();
    });
    rowsEl.appendChild(tr);
    renumber();
  }

  function renumber() {
    rowsEl.querySelectorAll('tr').forEach(function (tr, i) { tr.querySelector('.no').textContent = i + 1; });
  }

  function snapshot() {
    var rows = [];
    rowsEl.querySelectorAll('tr').forEach(function (tr) {
      rows.push({ name: tr.querySelector('.r-name').value, pos: tr.querySelector('.r-pos').value });
    });
    return { reel: document.getElementById('f-reel').value, reelPos: document.getElementById('f-reel-pos').value, model: document.getElementById('f-model').value, author: document.getElementById('f-author').value, rows: rows };
  }

  function saveDraft() { try { localStorage.setItem(STORE_KEY, JSON.stringify(snapshot())); } catch (e) {} }

  function restore(d) {
    document.getElementById('f-model').value = d.model || '';
    document.getElementById('f-date').value = todayISO();
    document.getElementById('f-author').value = d.author != null ? d.author : '石谷 豪';
    document.getElementById('f-reel').value = d.reel || '';
    document.getElementById('f-reel-pos').value = d.reelPos || '';
    rowsEl.innerHTML = '';
    (d.rows || []).forEach(addRow);
    while (rowsEl.children.length < DEFAULT_ROWS) addRow();
  }

  var draft = null;
  try { draft = JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) {}
  restore(draft || {});
  document.addEventListener('input', saveDraft);

  document.getElementById('btn-add').addEventListener('click', function () { addRow(); saveDraft(); });
  document.getElementById('btn-print').addEventListener('click', function () { window.print(); });
  document.getElementById('btn-reset').addEventListener('click', function () {
    if (!confirm('入力内容をすべてクリアしますか？')) return;
    restore({ author: document.getElementById('f-author').value });
    saveDraft();
  });

  function swapFields() {
    var swaps = [];
    document.querySelectorAll('.sheet input').forEach(function (el) {
      var text = el.value;
      if (el.type === 'date') { var p = el.value ? el.value.split('-') : null; text = p ? p[0] + '/' + Number(p[1]) + '/' + Number(p[2]) : ''; }
      var cs = getComputedStyle(el);
      var o = document.createElement('div');
      o.textContent = text || '\u00a0';
      o.style.cssText = 'font-family:inherit;font-size:' + cs.fontSize + ';font-weight:' + cs.fontWeight + ';text-align:' + cs.textAlign + ';padding:' + cs.padding + ';line-height:1.4;white-space:pre-wrap;width:100%;min-height:1.4em;';
      var prev = el.style.display;
      el.style.display = 'none';
      el.insertAdjacentElement('afterend', o);
      swaps.push({ el: el, o: o, prev: prev });
    });
    return swaps;
  }

  document.getElementById('btn-save').addEventListener('click', async function () {
    var btn = this, label = btn.textContent;
    btn.disabled = true; btn.textContent = '作成中…';
    var win = window.open('', '_blank');
    try { if (win) { win.document.write('<meta charset="utf-8"><meta name="viewport" content="width=device-width"><p style="font:16px sans-serif;padding:2rem">PDFを作成中です…数秒お待ちください</p>'); win.document.close(); } } catch (e) {}
    document.body.classList.add('pdf-capture');
    var swaps = swapFields();
    try {
      var canvas = await html2canvas(document.getElementById('sheet'), { scale: 2, backgroundColor: '#ffffff', windowWidth: 1000 });
      var pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
      var pageW = pdf.internal.pageSize.getWidth(), pageH = pdf.internal.pageSize.getHeight(), margin = 8;
      var imgW = pageW - margin * 2, imgH = imgW * canvas.height / canvas.width;
      if (imgH > pageH - margin * 2) { imgH = pageH - margin * 2; imgW = imgH * canvas.width / canvas.height; }
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', margin, margin, imgW, imgH);
      var model = document.getElementById('f-model').value.trim().replace(/[\\/:*?"<>|]/g, '') || 'ロッド仕様書';
      var name = model + '_仕様書_' + todayISO().replace(/-/g, '') + '.pdf';
      if (win) { win.location.href = pdf.output('bloburl'); } else { pdf.save(name); }
    } catch (e) {
      console.error(e);
      try { if (win) win.document.body.innerHTML = '<p style="font:16px sans-serif;padding:2rem">PDFの作成に失敗しました。元の画面に戻ってもう一度お試しください。<br><small>' + String(e && e.message || e) + '</small></p>'; } catch (e2) {}
      alert('PDFの作成に失敗しました。もう一度お試しください。');
    } finally {
      swaps.forEach(function (s) { s.o.remove(); s.el.style.display = s.prev; });
      document.body.classList.remove('pdf-capture');
      btn.disabled = false; btn.textContent = label;
    }
  });
</script>
<script>
  (function () {
    try {
      var p = location.pathname + location.search, k = 'fresh:' + p;
      if (sessionStorage.getItem(k)) return;
      Promise.all([
        fetch(p, { cache: 'force-cache' }).then(function (r) { return r.text(); }),
        fetch(p + (p.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); })
      ]).then(function (t) {
        if (t[0] !== t[1]) {
          sessionStorage.setItem(k, '1');
          fetch(p, { cache: 'reload' }).then(function () { location.reload(); });
        }
      }).catch(function () {});
    } catch (e) {}
  })();
</script>
</body>
</html>
