<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>自由記入ページ | IG Rod Planning</title>
<meta name="robots" content="noindex, nofollow" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --ink: #111; --sub: #555; --line: #999; --line2: #ddd; --red: #cc2200; --bg: #f2f2f0; --paper: #fff; }
  body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; padding: 1.6rem 1rem 4rem; }

  .toolbar { max-width: 794px; margin: 0 auto 0.8rem; display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
  .toolbar .back { margin-right: auto; font-size: 0.82rem; font-weight: 700; color: var(--sub); text-decoration: none; }
  .toolbar .back:hover { color: var(--red); }
  .toolbar .hist { margin-right: 0; font-size: 0.85rem; font-weight: 700; color: var(--ink); text-decoration: none; border: 1px solid var(--ink); padding: 0.6rem 1rem; background: #fff; }
  .toolbar button { font-family: inherit; font-size: 0.85rem; font-weight: 700; padding: 0.6rem 1.2rem; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; }
  .toolbar button:hover { background: var(--red); border-color: var(--red); }
  .toolbar button.secondary { background: #fff; color: var(--ink); }
  .toolbar button.secondary:hover { background: #eee; color: var(--ink); border-color: var(--ink); }
  .hint { max-width: 794px; margin: 0 auto 1rem; font-size: 0.72rem; color: var(--sub); }

  .sheet { width: 794px; max-width: 100%; margin: 0 auto; background: var(--paper); border: 1px solid #ddd; padding: 2rem 2.4rem 2.4rem; min-height: 20rem; }
  .sheet input, .sheet textarea { font-family: inherit; color: inherit; background: transparent; border: none; width: 100%; }
  .sheet input:focus, .sheet textarea:focus { outline: none; background: #fff8e0; }
  .sheet textarea { resize: none; overflow: hidden; display: block; }

  .head-title { font-size: 1.6rem; font-weight: 900; text-align: center; border-bottom: 3px solid var(--ink); padding: 0 0 0.5rem; }
  .head-meta { display: flex; justify-content: flex-end; gap: 1.2rem; margin: 0.4rem 0 0.4rem; font-size: 0.8rem; color: var(--sub); }
  .head-meta { flex-wrap: wrap; row-gap: 0.2rem; }
  .head-meta label { white-space: nowrap; }
  .head-meta label { display: inline-flex; align-items: center; gap: 0.3rem; }
  .head-meta input { width: auto; border-bottom: 1px solid var(--line2); font-size: 0.85rem; padding: 0.1rem 0.2rem; }
  .head-meta input.author { width: 8rem; }

  .head-meta .optchk { font-size: 0.7rem; }
  .head-meta .optchk input { width: auto; }
  body.no-author .au { opacity: 0.35; }
  .blk { margin-top: 0.9rem; position: relative; }
  .blk-bar { display: flex; align-items: center; gap: 0.3rem; font-size: 0.68rem; color: var(--sub); margin-bottom: 0.2rem; flex-wrap: wrap; }
  .blk-bar .kind { font-weight: 700; letter-spacing: 0.08em; background: #eee; padding: 0.1rem 0.5rem; margin-right: auto; }
  .blk-bar button { font-family: inherit; font-size: 0.72rem; font-weight: 700; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 0.2rem 0.55rem; cursor: pointer; }
  .blk-bar button:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
  .blk-bar button.danger:hover { background: var(--red); border-color: var(--red); }

  .b-heading input { font-size: 1.25rem; font-weight: 900; padding: 0.3rem 0.1rem; border-bottom: 2px solid var(--ink); }
  .b-text textarea { line-height: 1.7; padding: 0.3rem 0.1rem; min-height: 3.4em; }
  .fs0 textarea { font-size: 0.85rem; }
  .fs1 textarea { font-size: 1rem; }
  .fs2 textarea { font-size: 1.25rem; }
  .fs3 textarea { font-size: 1.6rem; }

  table.tbl { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.tbl td { border: 1.5px solid var(--ink); padding: 0; vertical-align: middle; }
  table.tbl td textarea { padding: 0.4rem 0.5rem; font-size: 0.95rem; line-height: 1.5; min-height: 2.4em; }
  table.tbl td.k { background: #111; }
  table.tbl td.k textarea { color: #fff; }
  table.tbl td.k textarea:focus { background: #333; }
  table.tbl td.kb textarea { font-weight: 700; }
  table.tbl tr.align-row td { border: none; padding: 0 0 0.2rem; }
  table.tbl tr.align-row select { width: 100%; font-family: inherit; font-size: 0.68rem; color: var(--sub); border: 1px solid var(--line2); background: #fafafa; padding: 0.15rem 0.1rem; }
  table.tbl td.rowsel { width: 1.9rem; border: none; background: transparent; text-align: center; vertical-align: middle; font-size: 0.68rem; color: var(--sub); cursor: pointer; user-select: none; -webkit-user-select: none; }
  table.tbl td.rowsel:hover { color: var(--ink); background: #eee; }
  table.tbl tr.align-row td.rowsel { cursor: default; background: transparent; }
  table.tbl td.sel { box-shadow: inset 0 0 0 3px #2a6df4; }
  .al-btn.on { background: var(--ink) !important; color: #fff !important; border-color: var(--ink) !important; }
  .hdr-opt { display: inline-flex; align-items: center; gap: 0.25rem; font-size: 0.72rem; }

  .img-area { position: relative; width: 100%; height: 200px; border: 1px dashed var(--line); background: #fafafa; overflow: hidden; touch-action: pan-y; }
  .img-area .empty-hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 0.78rem; color: var(--sub); pointer-events: none; }
  .img-area .im { position: absolute; cursor: move; touch-action: none; user-select: none; -webkit-user-select: none; }
  .img-area .im img { display: block; width: 100%; height: auto; pointer-events: none; -webkit-user-drag: none; }
  .img-area .im.sel { outline: 2px solid #2a6df4; }
  .img-area .im .rz { display: none; position: absolute; right: -2px; bottom: -2px; width: 22px; height: 22px; background: #2a6df4; cursor: nwse-resize; touch-action: none; border-radius: 3px 0 0 0; }
  .img-area .im .xx { display: none; position: absolute; top: -2px; right: -2px; width: 24px; height: 24px; background: #cc2200; color: #fff; text-align: center; line-height: 24px; font-size: 14px; font-weight: 700; cursor: pointer; border-radius: 0 0 0 3px; }
  .img-area .im.sel .rz, .img-area .im.sel .xx { display: block; }
  .area-grip { height: 12px; margin-top: 2px; background: #e6e6e6; cursor: ns-resize; touch-action: none; text-align: center; font-size: 0.6rem; line-height: 12px; color: var(--sub); user-select: none; -webkit-user-select: none; }
  .area-grip:hover { background: #d4d4d4; }
  .adds { max-width: 794px; margin: 0.8rem auto 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.5rem; }
  .adds button { font-family: inherit; font-size: 0.8rem; font-weight: 700; padding: 0.7rem 0.3rem; border: 1px dashed var(--line); background: #fff; color: var(--sub); cursor: pointer; }
  .adds button:hover { border-color: var(--ink); color: var(--ink); border-style: solid; }
  #f-img { display: none; }

  @media screen and (max-width: 640px) {
    .sheet { padding: 1.2rem 0.8rem 1.6rem; }
    .adds { grid-template-columns: repeat(2, 1fr); }
  }

  .pdf-capture .sheet { width: 794px; max-width: none; border: none; min-height: 0; }
  .pdf-capture .toolbar, .pdf-capture .adds, .pdf-capture .hint, .pdf-capture .blk-bar, .pdf-capture tr.align-row, .pdf-capture td.rowsel, .pdf-capture .area-grip, .pdf-capture .im .rz, .pdf-capture .im .xx, .pdf-capture .empty-hint { display: none !important; }
  .pdf-capture .img-area { border: none; background: none; }
  .pdf-capture .im.sel { outline: none; }
  .pdf-capture table.tbl td.sel { box-shadow: none; }
  .pdf-capture .head-meta input { border-bottom: none; }
  .pdf-capture .optchk, .pdf-capture.no-author .au { display: none; }

  @media print {
    body { background: #fff; padding: 0; }
    .toolbar, .adds, .hint, .blk-bar, tr.align-row, td.rowsel, .area-grip, .im .rz, .im .xx, .empty-hint { display: none !important; }
    .img-area { border: none; background: none; }
    .im.sel { outline: none; }
    table.tbl td.sel { box-shadow: none; }
    .sheet { width: 100%; border: none; padding: 0; }
    .head-meta input { border-bottom: none; }
    .optchk, body.no-author .au { display: none; }
    .blk { break-inside: avoid; }
    @page { size: A4; margin: 1.2cm; }
  }
</style>
</head>
<body>

  <div class="toolbar">
    <a class="back" href="tools.html">← ツール一覧</a>
    <a class="hist" href="free-note-history.html">保存一覧</a>
    <button type="button" class="secondary" id="btn-reset">新規</button>
    <button type="button" class="secondary" id="btn-print">印刷</button>
    <button type="button" class="secondary" id="btn-save-only">保存のみ</button>
    <button type="button" id="btn-save">PDFとして保存</button>
  </div>
  <p class="hint">下のボタンで「見出し・文章・表・画像」を好きな順に追加できます。各ブロックの↑↓で順番を入れ替え、×で削除。PDFは内容が長い場合、自動で複数ページになります。</p>

  <div class="sheet" id="sheet">
    <div class="blk head" id="head">
      <input type="text" class="head-title" id="f-title" placeholder="タイトル（例：打ち合わせメモ）">
      <div class="head-meta">
        <label>日付<input type="date" id="f-date"></label>
        <label class="au">作成者<input type="text" class="author" id="f-author" value="石谷 豪"></label>
        <label class="optchk"><input type="checkbox" id="opt-author" checked>PDFに作成者を載せる</label>
      </div>
    </div>
    <div id="blocks"></div>
  </div>

  <div class="adds">
    <button type="button" data-add="heading">＋ 見出し</button>
    <button type="button" data-add="text">＋ 文章</button>
    <button type="button" data-add="table">＋ 表</button>
    <button type="button" data-add="image">＋ 画像</button>
  </div>
  <input type="file" id="f-img" accept="image/*" multiple>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="pdf-download.js"></script>
<script>
  var SYNC_API = 'https://ig-sync.pokugou.workers.dev';
  var STORE_KEY = 'free-note-draft';
  var blocksEl = document.getElementById('blocks');
  var blocks = [];
  var currentId = null;
  var activeArea = null;   // image block that receives pasted pictures
  var pendingArea = null;  // image block waiting for the file chooser
  var selImg = null;       // { b, i } currently selected picture

  function todayISO() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function newTable(r, c) {
    var rows = [];
    for (var i = 0; i < r; i++) { var row = []; for (var j = 0; j < c; j++) row.push(''); rows.push(row); }
    return { type: 'table', header: true, rows: rows };
  }

  function addBlock(type) {
    if (type === 'heading') blocks.push({ type: 'heading', text: '' });
    else if (type === 'text') blocks.push({ type: 'text', text: '', fs: 1 });
    else if (type === 'table') blocks.push(newTable(4, 3));
    else if (type === 'image') { pendingArea = null; document.getElementById('f-img').click(); return; }
    renderBlocks(); saveDraft();
    var last = blocksEl.lastElementChild;
    if (last) last.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  // ---- image areas: pictures can be dragged anywhere inside the frame and resized with the corner handle.
  // x, w are fractions of the frame width; y and the frame height h are fractions of the frame width too,
  // so the layout stays identical on a phone, a PC and in the PDF.
  function normalizeBlocks(list) {
    list.forEach(function (b) {
      if (b.type === 'image' && !b.imgs) {
        var w = { s1: 0.33, s2: 0.6, s3: 1 }[b.size] || 0.6;
        b.imgs = b.src ? [{ src: b.src, x: 0, y: 0, w: w, ar: 0.75 }] : [];
        b.h = 0.5;
        delete b.src; delete b.size;
      }
    });
    return list;
  }

  function imgNeed(b) {
    var need = 0;
    (b.imgs || []).forEach(function (im) { need = Math.max(need, im.y + im.w * (im.ar || 0.75)); });
    return need;
  }

  function layoutAreas() {
    document.querySelectorAll('.img-area').forEach(function (area) {
      var b = blocks[+area.dataset.idx];
      var W = area.clientWidth;
      if (!b || !W) return;
      var need = imgNeed(b);
      b.h = Math.max(b.h || 0.4, need + 0.02, 0.15);
      area.style.height = Math.round(b.h * W) + 'px';
      Array.prototype.forEach.call(area.querySelectorAll('.im'), function (el) {
        var im = b.imgs[+el.dataset.i];
        el.style.left = (im.x * 100) + '%';
        el.style.width = (im.w * 100) + '%';
        el.style.top = Math.round(im.y * W) + 'px';
      });
    });
  }
  window.addEventListener('resize', layoutAreas);

  function selectImg(b, i) {
    selImg = b ? { b: b, i: i } : null;
    document.querySelectorAll('.im.sel').forEach(function (e) { e.classList.remove('sel'); });
    if (!b) return;
    var idx = blocks.indexOf(b);
    var area = blocksEl.children[idx] && blocksEl.children[idx].querySelector('.img-area');
    var el = area && area.querySelector('.im[data-i="' + i + '"]');
    if (el) el.classList.add('sel');
    activeArea = b;
  }

  function dragTracker(e, onMove, onEnd) {
    e.preventDefault();
    var sx = e.clientX, sy = e.clientY, target = e.currentTarget;
    try { target.setPointerCapture(e.pointerId); } catch (x) {}
    function mv(ev) { onMove(ev.clientX - sx, ev.clientY - sy); }
    function up() {
      target.removeEventListener('pointermove', mv);
      target.removeEventListener('pointerup', up);
      target.removeEventListener('pointercancel', up);
      if (onEnd) onEnd();
    }
    target.addEventListener('pointermove', mv);
    target.addEventListener('pointerup', up);
    target.addEventListener('pointercancel', up);
  }

  function buildArea(b, idx) {
    var area = document.createElement('div');
    area.className = 'img-area';
    area.dataset.idx = idx;
    if (!b.imgs.length) {
      var hint = document.createElement('div'); hint.className = 'empty-hint'; hint.textContent = '「＋ この枠に画像を追加」で画像を入れます（貼り付けもOK）';
      area.appendChild(hint);
    }
    area.addEventListener('pointerdown', function (e) { if (e.target === area) { selectImg(null); } });
    b.imgs.forEach(function (im, i) {
      var el = document.createElement('div'); el.className = 'im'; el.dataset.i = i;
      var img = document.createElement('img'); img.src = im.src; el.appendChild(img);
      img.addEventListener('load', function () {
        var ar = img.naturalHeight / img.naturalWidth;
        if (ar && Math.abs((im.ar || 0) - ar) > 0.001) { im.ar = ar; layoutAreas(); }
      });
      var rz = document.createElement('div'); rz.className = 'rz';
      var xx = document.createElement('div'); xx.className = 'xx'; xx.textContent = '×';
      el.appendChild(rz); el.appendChild(xx);
      if (selImg && selImg.b === b && selImg.i === i) el.classList.add('sel');
      xx.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
      xx.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!confirm('この画像を削除しますか？')) return;
        b.imgs.splice(i, 1); selImg = null; renderBlocks(); saveDraft();
      });
      el.addEventListener('pointerdown', function (e) {
        if (e.target === rz || e.target === xx) return;
        selectImg(b, i);
        var W = area.clientWidth, x0 = im.x, y0 = im.y;
        dragTracker(e, function (dx, dy) {
          im.x = Math.min(Math.max(0, x0 + dx / W), Math.max(0, 1 - im.w));
          im.y = Math.max(0, y0 + dy / W);
          layoutAreas();
        }, saveDraft);
      });
      rz.addEventListener('pointerdown', function (e) {
        e.stopPropagation();
        selectImg(b, i);
        var W = area.clientWidth, w0 = im.w;
        dragTracker(e, function (dx) {
          im.w = Math.min(Math.max(0.06, w0 + dx / W), 1 - im.x);
          layoutAreas();
        }, saveDraft);
      });
      area.appendChild(el);
    });
    return area;
  }

  function bindGrip(grip, b, wrap) {
    grip.addEventListener('pointerdown', function (e) {
      var area = wrap.querySelector('.img-area'), W = area.clientWidth, h0 = b.h || 0.4;
      dragTracker(e, function (dx, dy) {
        b.h = Math.max(imgNeed(b) + 0.02, 0.15, h0 + dy / W);
        layoutAreas();
      }, saveDraft);
    });
  }

  function grow(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; }

  var sel = null; // { b, r1, c1, r2, c2, ar, ac } selected cell range of a table block
  function cellAlign(b, ri, ci) {
    var v = b.cal && b.cal[ri + ',' + ci];
    return v || (b.align && b.align[ci]) || (b.header && ri === 0 ? 'center' : 'left');
  }
  function paintSel() {
    document.querySelectorAll('td.sel').forEach(function (td) { td.classList.remove('sel'); });
    if (!sel) return;
    var idx = blocks.indexOf(sel.b);
    if (idx < 0) { sel = null; return; }
    var tbl = blocksEl.children[idx].querySelector('table.tbl');
    if (!tbl) return;
    var r1 = Math.min(sel.r1, sel.r2), r2 = Math.max(sel.r1, sel.r2), c1 = Math.min(sel.c1, sel.c2), c2 = Math.max(sel.c1, sel.c2);
    tbl.querySelectorAll('td[data-r]').forEach(function (td) {
      var r = +td.dataset.r, c = +td.dataset.c;
      if (r >= r1 && r <= r2 && c >= c1 && c <= c2) td.classList.add('sel');
    });
  }
  function setSel(b, r1, c1, r2, c2, keepAnchor) {
    sel = { b: b, r1: keepAnchor && sel && sel.b === b ? sel.r1 : r1, c1: keepAnchor && sel && sel.b === b ? sel.c1 : c1, r2: r2, c2: c2 };
    paintSel();
  }
  function isBlack(b, ri, ci) {
    var v = b.fill && b.fill[ri + ',' + ci];
    return v ? v === 'black' : !!(b.header && ri === 0);
  }
  function applyFill(b, val) {
    if (!b.fill) b.fill = {};
    var nr = b.rows.length, nc = b.rows[0].length;
    var r1 = 0, r2 = nr - 1, c1 = 0, c2 = nc - 1;
    if (sel && sel.b === b) { r1 = Math.min(sel.r1, sel.r2); r2 = Math.max(sel.r1, sel.r2); c1 = Math.min(sel.c1, sel.c2); c2 = Math.max(sel.c1, sel.c2); }
    for (var r = r1; r <= r2; r++) for (var c = c1; c <= c2; c++) b.fill[r + ',' + c] = val;
    renderBlocks(); saveDraft();
  }
  function selRange(b) {
    var r1 = 0, r2 = b.rows.length - 1, c1 = 0, c2 = b.rows[0].length - 1;
    if (sel && sel.b === b) { r1 = Math.min(sel.r1, sel.r2); r2 = Math.max(sel.r1, sel.r2); c1 = Math.min(sel.c1, sel.c2); c2 = Math.max(sel.c1, sel.c2); }
    return { r1: r1, r2: r2, c1: c1, c2: c2 };
  }
  function isBold(b, ri, ci) {
    var v = b.bld && b.bld[ri + ',' + ci];
    return v === undefined ? !!(b.header && ri === 0) : !!v;
  }
  function applyColor(b, val) {
    if (!b.col) b.col = {};
    var g = selRange(b);
    for (var r = g.r1; r <= g.r2; r++) for (var c = g.c1; c <= g.c2; c++) { if (val) b.col[r + ',' + c] = val; else delete b.col[r + ',' + c]; }
    renderBlocks(); saveDraft();
  }
  function applyBold(b, val) { // val: true / false, or 'toggle'
    if (!b.bld) b.bld = {};
    var g = selRange(b), all = true;
    for (var r = g.r1; r <= g.r2; r++) for (var c = g.c1; c <= g.c2; c++) if (!isBold(b, r, c)) all = false;
    var v = val === 'toggle' ? !all : val;
    for (var r2 = g.r1; r2 <= g.r2; r2++) for (var c2 = g.c1; c2 <= g.c2; c2++) b.bld[r2 + ',' + c2] = v;
    renderBlocks(); saveDraft();
  }
  // 割り込み挿入：行（axis 'r'）か列（axis 'c'）を index の位置に入れ、そこから後ろのマス設定を1つずらす
  function insertAt(b, axis, index) {
    var ncols = b.rows[0].length;
    if (axis === 'r') b.rows.splice(index, 0, new Array(ncols).fill(''));
    else { b.rows.forEach(function (r) { r.splice(index, 0, ''); }); if (b.align) b.align.splice(index, 0, ''); }
    ['cal', 'fill', 'col', 'bld', 'va'].forEach(function (m) {
      if (!b[m]) return;
      var out = {};
      Object.keys(b[m]).forEach(function (k) {
        var p = k.split(','), r = +p[0], c = +p[1];
        if (axis === 'r' && r >= index) r += 1;
        if (axis === 'c' && c >= index) c += 1;
        out[r + ',' + c] = b[m][k];
      });
      b[m] = out;
    });
    if (axis === 'r') setSel(b, index, 0, index, b.rows[0].length - 1);
    else setSel(b, 0, index, b.rows.length - 1, index);
    renderBlocks(); saveDraft();
  }
  function insertNeedsSel(b) {
    if (sel && sel.b === b) return selRange(b);
    alert('先に、挿入したい位置のマス（または行番号）をクリックしてください。');
    return null;
  }
  function cellVAlign(b, ri, ci) { return (b.va && b.va[ri + ',' + ci]) || 'middle'; }
  function applyVAlign(b, val) {
    if (!b.va) b.va = {};
    var g = selRange(b);

    btn.disabled = true; btn.textContent = '作成中…';
    var win = window.open('', '_blank');
    try { if (win) { win.document.write('<meta charset="utf-8"><meta name="viewport" content="width=device-width"><p style="font:16px sans-serif;padding:2rem">PDFを作成中です…数秒お待ちください</p>'); win.document.close(); } } catch (e) {}
    try {
      var pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4' });
      var pageW = pdf.internal.pageSize.getWidth(), margin = 8;
      var imgW = pageW - margin * 2;
      var canvases = await renderPageCanvases();
      canvases.forEach(function (c, i) {
        if (i > 0) pdf.addPage();
        pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', margin, margin, imgW, imgW * c.height / c.width);
      });
      var title = document.getElementById('f-title').value.trim().replace(/[\\/:*?"<>|]/g, '') || '自由記入';
      var name = title + '_' + todayISO().replace(/-/g, '') + '.pdf';
      if (win) { win.location.href = pdf.output('bloburl'); } else { pdf.save(name); }
      if (window.showPdfDownload) showPdfDownload(pdf, name);
      btn.textContent = '一覧に保存中…';
      await saveToHistory();
    } catch (e) {
      console.error(e);
      try { if (win) win.document.body.innerHTML = '<p style="font:16px sans-serif;padding:2rem">PDFの作成に失敗しました。元の画面に戻ってもう一度お試しください。<br><small>' + String(e && e.message || e) + '</small></p>'; } catch (e2) {}
      alert('PDFの作成に失敗しました。もう一度お試しください。');
    } finally {
      btn.disabled = false; btn.textContent = label;
    }
  });
</script>
<script>
  (function () {
    try {
      var p = location.pathname + location.search, k = 'fresh:' + p;
      if (sessionStorage.getItem(k) || /[?&]embed=1/.test(location.search)) return;
      Promise.all([
        fetch(p, { cache: 'force-cache' }).then(function (r) { return r.text(); }),
        fetch(p + (p.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); })
      ]).then(function (t) {
        if (t[0] !== t[1]) {
          sessionStorage.setItem(k, '1');
          fetch(p, { cache: 'reload' }).then(function () { location.reload(); });
        }
      }).catch(function () {});
    } catch (e) {}
  })();
</script>
</body>
